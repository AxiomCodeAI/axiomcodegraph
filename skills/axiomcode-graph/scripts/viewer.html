  // directory names around the rim of the full disc
  if (!filter) for (const d of dirs) { if (!on(d.id) || (d.span * (R3 + 80) < 14 && d !== hover && d !== sel)) continue; const a = Math.atan2(d.dy, d.dx), R = R3 + 90, right = Math.cos(a) >= 0; ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle'; ctx.font = `600 ${11 / k}px ui-monospace, Menlo, monospace`; ctx.fillStyle = F && !F.has(d.id) ? 'rgba(129,140,248,.3)' : 'rgba(165,180,252,.85)'; ctx.fillText(d.l.slice(PREFIX.length) || d.l, R * Math.cos(a) + (right ? 4 : -4) / k, R * Math.sin(a)); }
  // chips: only what matters — the selection and its neighbours, matches, hover, and the big things when zoomed in
  const chips = [];
  if (hover && on(hover.id)) chips.push([hover, '#e5e7eb', true]);
  if (sel && on(sel.id) && sel !== hover) chips.push([sel, '#f59e0b', true]);
  if (F && (mode === 'select' || mode === 'chain' || (mode === 'impact' && F.size <= 60))) for (const id of F) { if (chips.length > 70) break; const n = N.get(id); if (n !== sel && n !== hover && on(id)) chips.push([n, mode === 'impact' ? '#fb7185' : mode === 'chain' ? '#f59e0b' : '#22d3ee', false]); }
  if (search && !F) for (const id of search.matches) { if (chips.length > 70) break; const n = N.get(id); if (on(id) && n !== hover) chips.push([n, '#22d3ee', false]); }
  if (!F && !search) for (const n of VIS) { if (chips.length > 90) break; if ((n.k === 'dir' && k > 1.2) || (n.k === 'file' && k > 2.2) || (n.k === 'type' && k > 3.2) || (n.k === 'method' && k > 7)) chips.push([n, colOf(n), false]); }
  if (few && !F && !search) for (const n of VIS) { if (chips.length > 120) break; if (!chips.some(c => c[0] === n)) chips.push([n, colOf(n), false]); }
  for (const [n, c, big] of chips) chip(n, k, c, big);
  status(); }
function status() { const S = document.getElementById('status'); if (!focus || focus.mode === 'hover' || focus.mode === 'select') { S.textContent = ''; return; } const n = N.get(focus.id); S.textContent = focus.mode === 'impact' ? `impact of ${n.l}: ${focus.set.size - 1} methods in ${focus.files} files can reach it through resolved calls` + (n.u ? ` · ${n.u} unresolved sites in its body make that a lower bound` : '') : `chain from ${n.l}: ${focus.path.length} hops, the heaviest resolved callee at each`; }
function counts() { const c = {}; for (const n of VIS) c[KIND(n)] = (c[KIND(n)] || 0) + 1; document.getElementById('counts').textContent = `${VIS.length} of ${DATA.nodes.length} nodes shown` + (filter ? ' · filtered' : ''); document.querySelectorAll('#types .tog').forEach(t => t.querySelector('.n').textContent = c[t.dataset.k] || 0); }
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = Math.min(60, Math.max(.05, view.k * (e.deltaY < 0 ? 1.15 : .87))); view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; mark(); }, { passive: false });
cv.addEventListener('mousedown', e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y, moved: false }; cv.classList.add('grab'); });
window.addEventListener('mousemove', e => { if (drag) { drag.moved = true; view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; mark(); return; } const r = cv.getBoundingClientRect(), n = pick(e.clientX - r.left, e.clientY - r.top); if (n !== hover) { hover = n; if (!sel) focus = n ? { id: n.id, set: neighbours(n), mode: 'hover' } : null; mark(); } });
window.addEventListener('mouseup', e => { if (!drag) return; const moved = drag.moved; drag = null; cv.classList.remove('grab'); if (moved) return; const r = cv.getBoundingClientRect(); select(pick(e.clientX - r.left, e.clientY - r.top)); });
cv.addEventListener('dblclick', e => { const r = cv.getBoundingClientRect(), n = pick(e.clientX - r.left, e.clientY - r.top); if (n) centre(n, Math.max(view.k * 2.2, 5)); });
window.addEventListener('resize', resize);

// ── selection · impact · chain · panel ────────────────────────────────────────────────────────────
function select(n) { sel = n; focus = n ? { id: n.id, set: neighbours(n), mode: 'select' } : null; if (hops && !search) applyFilter(); else mark(); panel(); }
function doImpact(n) { const seen = new Set([n.id]), dq = [n.id]; while (dq.length) { const u = dq.shift(); for (const e of (IN.get(u) || [])) if (RES(e.tier) && !seen.has(e.s)) { seen.add(e.s); dq.push(e.s); } } focus = { id: n.id, set: seen, mode: 'impact', files: new Set([...seen].map(id => N.get(id).f)).size }; mark(); panel(); }
function doChain(n) { const p = [n.id], seen = new Set(p); while (p.length <= 12) { const es = (OUT.get(p[p.length - 1]) || []).filter(e => RES(e.tier) && !seen.has(e.t)).sort((a, b) => b.w - a.w || ((OUT.get(b.t) || []).length - (OUT.get(a.t) || []).length)); if (!es.length) break; p.push(es[0].t); seen.add(es[0].t); } focus = { id: n.id, set: seen, mode: 'chain', path: p }; mark(); panel(); }
const dot = o => `<i style="background:${colOf(o)}"></i>`;
function panel() { const P = document.getElementById('panel');
  const filt = search ? `<div class="filt">showing only <b>${search.matches.size}</b> match${search.matches.size === 1 ? '' : 'es'} for “${esc(search.text)}”${hops ? ` and everything within ${hops} hop${hops > 1 ? 's' : ''}` : ''} — ${VIS.length} nodes · <span class="btn" id="clr" style="margin:0">clear ✕</span></div>` : '';
  if (!sel) { const gods = methods.filter(n => !n.t).sort((a, b) => (b.d || 0) - (a.d || 0)).slice(0, 12);
    P.innerHTML = filt + `<h2>${esc(m.repo)}</h2><div class="note">${esc(m.language)} · built ${esc(m.built)} · ${m.counts.dir || 0} directories · ${m.counts.file || 0} files · ${m.counts.type || 0} types · ${m.counts.method || 0} methods</div>
      <div class="note">The disc is the repository: directories in the centre, then files, then the types in them, then every method outside, each under its parent. Lines are calls the engine resolved; an amber dot marks a method with calls it could not resolve.</div>
      <h3>most connected methods</h3><ul>${gods.map(n => `<li data-n="${esc(n.id)}">${dot(n)}<span class="lbl">${esc(n.l)}</span><span class="loc">${n.d}</span></li>`).join('')}</ul>
      <h3>directories</h3><ul>${dirs.map(d => `<li data-n="${esc(d.id)}">${dot(d)}<span class="lbl">${esc(d.l)}</span><span class="loc">${(KIDS.get(d.id) || []).length} files</span></li>`).join('')}</ul>`; }
  else { const n = sel, outs = OUT.get(n.id) || [], ins = IN.get(n.id) || [], kids = KIDS.get(n.id) || [];
    const li = (e, other) => { const o = N.get(other); return `<li data-n="${esc(o.id)}"><span class="tier ${esc(e.tier)}">${esc(e.tier)}</span><span class="lbl">${esc(o.l)}</span><span class="loc">${esc(loc(o))}${e.w > 1 ? ' ×' + e.w : ''}</span></li>`; };
    const kid = o => `<li data-n="${esc(o.id)}">${dot(o)}<span class="lbl">${esc(short(o))}</span><span class="loc">${o.k === 'method' ? o.a : (KIDS.get(o.id) || []).length}</span></li>`;
    P.innerHTML = filt + `<h2>${esc(n.l)}</h2><div class="note">${esc(KIND(n))}${n.t ? ' · test' : ''}</div><div class="mono" style="word-break:break-all">${esc(loc(n))}${n.b > n.a ? '–' + n.b : ''}</div>${n.sig && n.sig !== n.l ? `<div class="mono" style="word-break:break-all">${esc(n.sig)}</div>` : ''}
      <div style="margin-top:6px">${isEntry(n) ? `<span class="tag e">entry: ${esc(n.e.join(', '))}</span>` : ''}${n.u ? `<span class="tag u" title="call sites in this body the engine could not resolve — each MAY be a call not drawn">? ${n.u} unresolved</span>` : ''}${n.lib ? `<span class="tag" title="${esc(n.lib.join('\n'))}">→ library ×${n.lib.length}</span>` : ''}</div>
      <div>${n.k === 'method' ? `<span class="btn${focus && focus.mode === 'impact' ? ' on' : ''}" data-x="impact">impact ↑</span><span class="btn${focus && focus.mode === 'chain' ? ' on' : ''}" data-x="chain">chain ⇢</span>` : ''}<span class="btn" data-x="zoom">zoom to</span><span class="btn" data-x="clear">deselect</span></div>
      ${focus && focus.mode === 'impact' ? `<div class="note" style="color:#fb7185">${focus.set.size - 1} methods in ${focus.files} files can reach this through resolved calls${n.u ? `; ${n.u} unresolved sites in its body make that a lower bound` : ''}.</div>` : ''}
      ${focus && focus.mode === 'chain' ? `<h3>chain</h3><ul>${focus.path.map((id, i) => `<li data-n="${esc(id)}"><span class="tier">${i}</span><span class="lbl">${esc(N.get(id).l)}</span><span class="loc">${esc(loc(N.get(id)))}</span></li>`).join('')}</ul>` : ''}
      ${ins.length ? `<h3>called by (${ins.length})</h3><ul>${ins.slice(0, 60).map(e => li(e, e.s)).join('')}${ins.length > 60 ? `<li class="note">… ${ins.length - 60} more</li>` : ''}</ul>` : ''}
      ${outs.length ? `<h3>calls (${outs.length})</h3><ul>${outs.slice(0, 60).map(e => li(e, e.t)).join('')}${outs.length > 60 ? `<li class="note">… ${outs.length - 60} more</li>` : ''}</ul>` : ''}
      ${(XOUT.get(n.id) || []).length ? `<h3>extends</h3><ul>${XOUT.get(n.id).map(t => kid(N.get(t))).join('')}</ul>` : ''}${(XIN.get(n.id) || []).length ? `<h3>subtypes</h3><ul>${XIN.get(n.id).map(t => kid(N.get(t))).join('')}</ul>` : ''}
      ${kids.length ? `<h3>contains (${kids.length})</h3><ul>${kids.slice(0, 80).map(kid).join('')}</ul>` : ''}${n.p ? `<h3>in</h3><ul>${kid(N.get(n.p))}</ul>` : ''}`;
    P.querySelectorAll('.btn[data-x]').forEach(b => b.onclick = () => { const x = b.dataset.x; if (x === 'impact') doImpact(n); else if (x === 'chain') doChain(n); else if (x === 'zoom') centre(n, Math.max(view.k, 5)); else select(null); }); }
  P.querySelectorAll('li[data-n]').forEach(x => x.onclick = () => { const o = N.get(x.dataset.n); if (!VISSET.has(o.id)) clearSearch(); select(o); centre(o, Math.max(view.k, 4)); });
  const c = P.querySelector('#clr'); if (c) c.onclick = clearSearch; }

// ── left panel: toggles ───────────────────────────────────────────────────────────────────────────
const T = document.getElementById('types'); T.innerHTML = Object.keys(COL).map(k => `<div class="tog" data-k="${k}"><i style="background:${COL[k]}"></i>${k === 'dir' ? 'directory' : k}<span class="n"></span></div>`).join('');
T.querySelectorAll('.tog').forEach(t => t.onclick = () => { show[t.dataset.k] = !show[t.dataset.k]; t.classList.toggle('off', !show[t.dataset.k]); recompute(); });
const FL = document.getElementById('flags'); FL.innerHTML = `<div class="tog" data-f="u"><i style="background:#fbbf24"></i>has unresolved calls</div><div class="tog" data-f="e"><i style="background:#0b0d14;border:1.5px solid #fff"></i>entry point</div><div class="tog" data-f="t"><i style="background:#0b0d14;border:1.5px dotted #94a3b8"></i>test</div>`;
FL.querySelectorAll('.tog').forEach(t => t.onclick = () => { only[t.dataset.f] = !only[t.dataset.f]; t.classList.toggle('only', only[t.dataset.f]); recompute(); if (only.u || only.e || only.t) fitVisible(); });
const ED = document.getElementById('edges'); ED.innerHTML = `<div class="tog edge" data-e="known"><i style="border-color:#94a3b8"></i>call, one resolved target</div><div class="tog edge" data-e="inf"><i style="border-color:#22d3ee"></i>call, a sound set of targets</div><div class="tog edge" data-e="ext"><i style="border-color:#a78bfa;border-top-style:dashed"></i>extends / implements</div><div class="tog edge" data-e="tree"><i style="border-color:#6366f1;opacity:.6"></i>structure (parent → child)</div>`;
ED.querySelectorAll('.tog').forEach(t => t.onclick = () => { edges[t.dataset.e] = !edges[t.dataset.e]; t.classList.toggle('off', !edges[t.dataset.e]); mark(); });
const H = document.getElementById('hops'); H.innerHTML = ['all', 1, 2, 3].map(h => `<span data-h="${h === 'all' ? 0 : h}" class="${h === 'all' ? 'on' : ''}">${h === 'all' ? 'all' : h + ' hop' + (h > 1 ? 's' : '')}</span>`).join('');
H.querySelectorAll('span').forEach(s => s.onclick = () => { hops = +s.dataset.h; H.querySelectorAll('span').forEach(x => x.classList.toggle('on', x === s)); applyFilter(); if (!filter) fitAll(); panel(); });
function fitAll() { for (const n of DATA.nodes) { n.x = n.dx; n.y = n.dy; } rebuildGrid(); const w = wrap.clientWidth, h = wrap.clientHeight, ext = R3 + 200; view.k = Math.min(w - 260, h) / (2 * ext) * .98; view.x = w / 2; view.y = h / 2; mark(); }

// ── search (right): type to see matches; Enter or a click shows ONLY the matches (and their hops) ─────────────
const q = document.getElementById('q'), hits = document.getElementById('hits'), sbox = document.getElementById('search'); let cur = [];
const score = (n, s) => { const l = n.l.toLowerCase(); if (l === s) return 0; if (l.endsWith('.' + s) || l.endsWith('/' + s)) return 1; if (l.split('.').pop() === s) return 2; if (l.startsWith(s)) return 3; if (l.includes(s)) return 4; if (n.f && n.f.toLowerCase().includes(s)) return 6; return 9; };
q.oninput = () => { const s = q.value.trim().toLowerCase(); sbox.classList.toggle('has', !!s); if (s.length < 2) { hits.innerHTML = ''; cur = []; return; }
  cur = DATA.nodes.map(n => [score(n, s), n]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || (b[1].d || 0) - (a[1].d || 0)).slice(0, 12).map(x => x[1]);
  hits.innerHTML = cur.map((n, i) => `<div data-i="${i}">${dot(n)}<span class="lbl">${esc(n.l)}</span><span class="loc">${esc(loc(n))}</span></div>`).join('') + (cur.length ? `<div class="note" style="padding:6px 4px">Enter shows only the matching nodes; a row shows only that one</div>` : '<div class="note">nothing named like that</div>');
  hits.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => showOnly([cur[+d.dataset.i]], q.value.trim())); };
q.onkeydown = e => { if (e.key === 'Enter') { const s = q.value.trim().toLowerCase(); if (s.length < 2) return; const all = DATA.nodes.filter(n => score(n, s) < 6); showOnly(all.length ? all : cur, q.value.trim()); } if (e.key === 'Escape') clearSearch(); };
function showOnly(nodes, text) { if (!nodes.length) return; search = { text, matches: new Set(nodes.map(n => n.id)) }; hits.innerHTML = ''; sel = null; focus = null; applyFilter(); if (nodes.length === 1) select(nodes[0]); else panel(); }
function clearSearch() { search = null; q.value = ''; sbox.classList.remove('has'); hits.innerHTML = ''; filter = null; recompute(); fitAll(); panel(); }
document.getElementById('qx').onclick = clearSearch;

resize(); recompute(); fitAll(); panel();
(function route() { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('q')) { q.value = h.get('q'); q.oninput(); q.onkeydown({ key: 'Enter' }); return; } const n = h.get('n') && DATA.nodes.find(x => x.l === h.get('n')); if (!n) return; select(n); centre(n, 5); if (h.get('impact')) doImpact(n); if (h.get('chain')) doChain(n); })();
</script>
</body>
</html>
