<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>axiomcode call chains</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#fafaf9; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --known:#44403c; --inf:#0284c7; --amb:#a8a29e; --hi:#fef3c7; --test:#64748b; }
  * { box-sizing:border-box } html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--mute) }
  #top { display:flex; align-items:center; gap:16px; padding:8px 14px; border-bottom:1px solid var(--line); background:#fff }
  #top h1 { font-size:14px; margin:0; font-weight:600 } #top h1 span { color:var(--mute); font-weight:400 }
  #top input { margin-left:auto; width:340px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font:inherit }
  #main { display:flex; height:calc(100% - 45px) }
  #list { width:400px; border-right:1px solid var(--line); background:#fff; overflow:auto }
  #list h3, #view h3 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:12px 14px 4px }
  .chain { padding:8px 14px; border-bottom:1px solid #f5f5f4; cursor:pointer } .chain:hover { background:#fafaf9 } .chain.sel { background:var(--hi) }
  .chain .root { font-weight:600 } .chain .meta { color:var(--mute); font-size:11px; margin-left:6px } .chain .prev { color:var(--mute); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px }
  .chain.test .root { color:var(--test) }
  #view { flex:1; overflow:auto; padding:14px 18px }
  #view .empty { color:var(--mute); margin-top:40px; text-align:center }
  .row { display:flex; align-items:flex-start; gap:0; flex-wrap:wrap; row-gap:18px; margin:10px 0 }
  .hop { background:#fff; border:1.5px solid var(--ink); border-radius:8px; padding:8px 12px; min-width:150px; max-width:260px; position:relative }
  .hop.test { border-style:dashed; border-color:var(--test) } .hop.entry { border-width:2.5px } .hop.sel { background:var(--hi) }
  .hop .name { font-weight:600; word-break:break-word } .hop .loc { display:block; margin-top:2px; word-break:break-all; white-space:normal }
  .hop .sig { display:block; margin-top:2px; color:#a8a29e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hop .flags { margin-top:5px; display:flex; gap:6px; flex-wrap:wrap }
  .tag { font-size:10px; padding:1px 6px; border-radius:4px; background:#f5f5f4; color:var(--mute) } .tag.u { background:#fef3c7; color:#92400e } .tag.e { background:#dcfce7; color:#166534 } .tag.lib { background:#f1f5f9; color:#475569 }
  .hop .acts { margin-top:6px; display:flex; gap:8px } .hop .acts a { font-size:11px; color:#0369a1; cursor:pointer; text-decoration:none } .hop .acts a:hover { text-decoration:underline } .hop .acts a.on { font-weight:600 }
  .arr { display:flex; align-items:center; align-self:flex-start; margin-top:18px; width:46px; flex:none } .arr svg { width:46px; height:14px }
  .branch { margin:6px 0 14px 28px; padding-left:14px; border-left:2px solid var(--line) }
  .branch > .bh { color:var(--mute); font-size:11.5px; margin:6px 0 } .branch .item { display:flex; align-items:flex-start; gap:0; margin:6px 0 }
  .lead { width:34px; flex:none; margin-top:18px } .lead svg { width:34px; height:14px }
  .legend { color:var(--mute); font-size:11.5px; margin:0 0 8px; display:flex; gap:18px; flex-wrap:wrap; align-items:center } .legend svg { width:40px; height:12px; vertical-align:middle }
</style>
</head>
<body>
<div id="top"><h1>axiomcode call chains <span id="ttl"></span></h1><input id="q" placeholder="filter chains, or type a method name to start a chain there" autocomplete="off"></div>
<div id="main"><div id="list"></div><div id="view"><div class="empty">pick a chain on the left</div></div></div>
<script>
const DATA = /*__DATA__*/null;
const N = new Map(DATA.nodes.map(n => [n.id, n]));
const OUT = new Map(), IN = new Map();
for (const e of DATA.edges) { (OUT.get(e.s) || OUT.set(e.s, []).get(e.s)).push(e); (IN.get(e.t) || IN.set(e.t, []).get(e.t)).push(e); }
const RES = t => t === 'known_edge' || t === 'multi_inferred';
const rank = e => (RES(e.tier) ? 0 : 1) * 1e6 - e.w * 1000 - (OUT.get(e.t) || []).length;
for (const l of OUT.values()) l.sort((a, b) => rank(a) - rank(b));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const loc = n => `${n.f}:${n.a}`;
const m = DATA.meta; document.getElementById('ttl').textContent = `${m.repo} · ${m.language} · ${m.methods} methods · ${m.edges} call edges, ${m.resolved} resolved · ${m.unresolved_sites} unresolved sites · ${m.chains} chains`;

// an arrow that says how sure the engine is: solid = one resolved target · dashed blue = a sound set · dotted grey = ambiguous
const arrow = (e, w = 46) => { const c = e.tier === 'known_edge' ? 'var(--known)' : e.tier === 'multi_inferred' ? 'var(--inf)' : 'var(--amb)', d = e.tier === 'known_edge' ? '' : e.tier === 'multi_inferred' ? '5,3' : '2,3';
  return `<svg viewBox="0 0 ${w} 14"><title>${esc(e.tier)}${e.w > 1 ? ' · ' + e.w + ' call sites' : ''}${e.line ? ' · line ' + e.line : ''}</title><line x1="1" y1="7" x2="${w - 8}" y2="7" stroke="${c}" stroke-width="1.6" stroke-dasharray="${d}"/><path d="M${w - 9},2 L${w - 1},7 L${w - 9},12 z" fill="${c}"/></svg>`; };

function hop(n, opts = {}) {
  const outs = OUT.get(n.id) || [], ins = IN.get(n.id) || [];
  const others = outs.filter(e => e.t !== opts.next);
  return `<div class="hop${n.t ? ' test' : ''}${n.e ? ' entry' : ''}${opts.sel ? ' sel' : ''}" data-id="${esc(n.id)}">
    <div class="name">${esc(n.l)}</div><span class="loc mono">${esc(loc(n))}${n.b > n.a ? '–' + n.b : ''}</span>${n.sig && n.sig !== n.l ? `<span class="sig mono" title="${esc(n.sig)}">${esc(n.sig)}</span>` : ''}
    <div class="flags">${n.e ? `<span class="tag e">entry: ${esc(n.e.join(', '))}</span>` : ''}${n.t ? '<span class="tag">test</span>' : ''}${n.u ? `<span class="tag u" title="call sites in this body whose target the engine could not resolve — each MAY be a call this page is not showing">? ${n.u} unresolved</span>` : ''}${n.lib ? `<span class="tag lib" title="${esc(n.lib.join('\n'))}">→ library ×${n.lib.length}</span>` : ''}</div>
    <div class="acts">${others.length ? `<a data-act="down">+ ${others.length} more callee${others.length > 1 ? 's' : ''}</a>` : '<span class="mono">leaf</span>'}${ins.length ? `<a data-act="up">↑ ${ins.length} caller${ins.length > 1 ? 's' : ''}</a>` : ''}<a data-act="chain" title="start a chain from here">chain ⇢</a></div></div>`;
}
// expand under a hop: its other callees (down) or its callers (up), each expandable again
function branch(id, act, skip) {
  const n = N.get(id); const list = act === 'down' ? (OUT.get(id) || []).filter(e => e.t !== skip) : (IN.get(id) || []);
  const items = list.map(e => { const o = N.get(act === 'down' ? e.t : e.s); return `<div class="item"><div class="lead">${arrow(e, 34)}</div>${hop(o)}</div>`; }).join('');
  return `<div class="branch" data-for="${esc(id)}" data-act="${act}"><div class="bh">${esc(n.l)} ${act === 'down' ? 'also calls' : 'is called by'} (${list.length}):</div>${items}</div>`;
}
function mainChain(from) { const path = [from], seen = new Set(path); while (path.length <= 10) { const e = (OUT.get(path[path.length - 1]) || []).find(e => RES(e.tier) && !seen.has(e.t)); if (!e) break; path.push(e.t); seen.add(e.t); } return path; }

let cur = null;
function show(path, title) {
  cur = path; const V = document.getElementById('view');
  let row = '';
  path.forEach((id, i) => { const e = i ? (OUT.get(path[i - 1]) || []).find(e => e.t === id) : null; row += (e ? `<div class="arr">${arrow(e)}</div>` : '') + hop(N.get(id), { next: path[i + 1] }); });
  V.innerHTML = `<h3 style="margin-left:0">${esc(title)}</h3><div class="legend"><span>${arrow({ tier: 'known_edge', w: 1 }, 40)} one resolved target</span><span>${arrow({ tier: 'multi_inferred', w: 1 }, 40)} a sound set of targets</span><span>${arrow({ tier: 'x', w: 1 }, 40)} declared ambiguous</span><span>dashed box = test · thick box = entry point · <b>+</b> expands, deeper each time</span></div><div class="row">${row}</div>`;
  document.querySelectorAll('.chain').forEach(c => c.classList.toggle('sel', c.dataset.root === path[0] && !title.startsWith('from ')));
}
document.getElementById('view').addEventListener('click', ev => {
  const a = ev.target.closest('a[data-act]'); if (!a) return; const h = a.closest('.hop'), id = h.dataset.id, act = a.dataset.act;
  if (act === 'chain') { show(mainChain(id), 'from ' + N.get(id).l); return; }
  const parent = h.parentElement, existing = [...parent.children].find(x => x.classList && x.classList.contains('branch') && x.dataset.for === id && x.dataset.act === act);
  if (existing) { existing.remove(); a.classList.remove('on'); return; }
  const skip = cur && cur.includes(id) ? cur[cur.indexOf(id) + 1] : null;
  const wrap = document.createElement('div'); wrap.innerHTML = branch(id, act, skip); const b = wrap.firstElementChild;
  if (parent.classList.contains('row')) { parent.insertAdjacentElement('afterend', b); b.dataset.for = id; } else h.insertAdjacentElement('afterend', b);
  a.classList.add('on');
});

// the list: code chains first, tests after; filter by text; a method name that is not a chain root starts a chain there
function list(filter = '') {
  const L = document.getElementById('list'); const f = filter.trim().toLowerCase();
  const rows = DATA.chains.filter(c => !f || c.path.some(id => N.get(id).l.toLowerCase().includes(f)));
  const code = rows.filter(c => !N.get(c.root).t), tests = rows.filter(c => N.get(c.root).t);
  const item = c => { const r = N.get(c.root); return `<div class="chain${r.t ? ' test' : ''}" data-root="${esc(c.root)}"><span class="root">${esc(r.l)}</span><span class="meta">${c.path.length} hops · reaches ${c.reach}${r.e ? ' · ' + esc(r.e.join(', ')) : ''}</span><div class="prev">${c.path.slice(1).map(id => esc(N.get(id).l.split('.').pop())).join(' → ')}</div></div>`; };
  let starts = '';
  if (f.length >= 3) { const hits = DATA.nodes.filter(n => n.l.toLowerCase().includes(f) && (OUT.get(n.id) || []).length && !DATA.chains.some(c => c.root === n.id)).slice(0, 12);
    if (hits.length) starts = `<h3>start a chain at</h3>${hits.map(n => `<div class="chain" data-start="${esc(n.id)}"><span class="root">${esc(n.l)}</span><span class="meta">${(OUT.get(n.id) || []).length} callees</span><div class="prev mono">${esc(loc(n))}</div></div>`).join('')}`; }
  L.innerHTML = `${starts}<h3>chains from entry points and roots (${code.length})</h3>${code.slice(0, 300).map(item).join('')}${code.length > 300 ? `<div class="chain mono">… ${code.length - 300} more — filter to find them</div>` : ''}<h3>chains from tests (${tests.length})</h3>${tests.slice(0, 200).map(item).join('')}${tests.length > 200 ? `<div class="chain mono">… ${tests.length - 200} more</div>` : ''}`;
  L.querySelectorAll('.chain[data-root]').forEach(d => d.onclick = () => { const c = DATA.chains.find(c => c.root === d.dataset.root); show(c.path, N.get(c.root).l); });
  L.querySelectorAll('.chain[data-start]').forEach(d => d.onclick = () => show(mainChain(d.dataset.start), 'from ' + N.get(d.dataset.start).l));
}
document.getElementById('q').oninput = e => list(e.target.value);
list();
// #from=<Owner.method>[&open=<Owner.method>] opens a chain from a method, optionally with one hop expanded — a link to a chain
function route() { const h = new URLSearchParams(location.hash.slice(1)); const byLabel = l => DATA.nodes.find(n => n.l === l);
  const from = h.get('from') && byLabel(h.get('from')); if (!from) { if (DATA.chains.length) { const c = DATA.chains[0]; show(c.path, N.get(c.root).l); } return; }
  const c = DATA.chains.find(c => c.root === from.id); show(c ? c.path : mainChain(from.id), (c ? '' : 'from ') + from.l);
  const open = h.get('open') && byLabel(h.get('open')); if (open) { const a = document.querySelector(`.hop[data-id="${CSS.escape(open.id)}"] a[data-act="down"]`); if (a) a.click(); } }
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
