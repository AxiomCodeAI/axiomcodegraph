<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>axiomcode graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#fafaf9; --panel:#ffffff; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --edge:#a8a29e; --edge-known:#57534e; --edge-inf:#0284c7; --edge-amb:#c4c0bb; --hier:#7c3aed; --focus:#f59e0b; --test:#94a3b8; --lib:#d6d3d1; }
  * { box-sizing:border-box } html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  #top { display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); position:relative; z-index:2 }
  #top h1 { font-size:14px; margin:0; font-weight:600 } #top h1 span { color:var(--mute); font-weight:400 }
  #crumbs { display:flex; gap:6px; align-items:center; flex:1; min-width:0; overflow:hidden; white-space:nowrap }
  #crumbs a { color:var(--ink); text-decoration:none; padding:2px 8px; border-radius:6px; background:#f5f5f4; cursor:pointer; max-width:340px; overflow:hidden; text-overflow:ellipsis; display:inline-block }
  #crumbs a.cur { background:var(--ink); color:#fff } #crumbs .sep { color:var(--mute) }
  #search { position:relative } #search input { width:320px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff }
  #hits { position:absolute; top:34px; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.08); display:none; max-height:360px; overflow:auto; z-index:5 }
  #hits div { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:baseline } #hits div:hover, #hits div.sel { background:#f5f5f4 }
  #hits small { color:var(--mute); margin-left:auto; font-family:ui-monospace,Menlo,monospace; font-size:11px; white-space:nowrap }
  #main { display:flex; height:calc(100% - 45px) } #canvas { flex:1; position:relative; overflow:hidden; cursor:grab } #canvas:active { cursor:grabbing }
  svg { width:100%; height:100%; display:block }
  #side { width:360px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px }
  #side h2 { font-size:15px; margin:0 0 2px; word-break:break-word } #side .k { color:var(--mute); font-size:12px; margin-bottom:10px }
  #side h3 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:14px 0 4px }
  #side ul { list-style:none; margin:0; padding:0 } #side li { padding:3px 0; border-bottom:1px solid #f5f5f4; display:flex; gap:6px; align-items:baseline; cursor:pointer }
  #side li:hover { background:#fafaf9 } #side li .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #side li .loc, .mono { color:var(--mute); font-family:ui-monospace,Menlo,monospace; font-size:11px; white-space:nowrap }
  #side li .loc { max-width:42%; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left } #side .mono.wrap { white-space:normal; word-break:break-all }
  .tier { font-size:10px; padding:1px 5px; border-radius:4px; background:#f5f5f4; color:var(--mute) } .tier.known_edge { background:#e7e5e4; color:#44403c } .tier.multi_inferred { background:#e0f2fe; color:#0369a1 } .tier.dispatch { background:#ede9fe; color:#6d28d9 }
  .note { background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; margin:10px 0; font-size:12px }
  #legend.min > *:not(b:first-child) { display:none } #legend b:first-child { cursor:pointer; margin-top:0 } #legend b:first-child::after { content:'  ▾'; } #legend.min b:first-child::after { content:'  ▸' }
  #legend { position:absolute; left:14px; bottom:14px; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:11.5px; line-height:1.7; z-index:2 }
  #legend svg { width:auto; height:auto; vertical-align:middle } #legend .row { display:flex; gap:8px; align-items:center } #legend b { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin-top:4px }
  #hint { position:absolute; right:14px; bottom:14px; color:var(--mute); font-size:11px; background:rgba(255,255,255,.9); padding:4px 8px; border-radius:6px }
  text { font-family:ui-sans-serif,system-ui,sans-serif; pointer-events:none; user-select:none } .lbl-mono { font-family:ui-monospace,Menlo,monospace }
  .node { cursor:pointer } .node:hover .shape { stroke-width:2.6 } .cluster { cursor:pointer } .cluster:hover > rect { stroke:var(--ink) }
  .edge { fill:none; pointer-events:stroke } .edge:hover { stroke:var(--focus) !important; stroke-width:2.4 !important }
  .dim { opacity:.18 }
</style>
</head>
<body>
<div id="top">
  <h1 id="title">axiomcode graph <span></span></h1>
  <div id="crumbs"></div>
  <div id="search"><input id="q" placeholder="find a class, method, file…  (Enter jumps)" autocomplete="off"><div id="hits"></div></div>
</div>
<div id="main">
  <div id="canvas"><svg id="svg"><defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker>
    <marker id="arr-hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#fff" stroke="context-stroke" stroke-width="1.2"/></marker>
  </defs><g id="root"></g></svg>
    <div id="legend"></div><div id="hint">scroll to zoom · drag to pan · click a box to open it · click a node for its neighbourhood</div>
  </div>
  <div id="side"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
// ── palette for communities (distinct, printable) ───────────────────────────────────────────────
const PAL = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#ea580c','#4f46e5','#0d9488','#b45309','#9333ea','#be123c','#0369a1','#15803d'];
const col = c => c < 0 ? '#a8a29e' : PAL[c % PAL.length];
const N = new Map(DATA.nodes.map(n => [n.id, n]));
const OUT = new Map(), IN = new Map();
for (const l of DATA.links) { (OUT.get(l.s) || OUT.set(l.s, []).get(l.s)).push(l); (IN.get(l.t) || IN.set(l.t, []).get(l.t)).push(l); }
const C = new Map(DATA.communities.map(c => [c.id, c]));
const byComm = new Map(); for (const n of DATA.nodes) { if (!byComm.has(n.c)) byComm.set(n.c, []); byComm.get(n.c).push(n); }
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const short = (s, n = 34) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const loc = n => n.f ? `${n.f}:${n.a}` : '(library)';
document.querySelector('#title span').textContent = `${DATA.meta.repo} · ${DATA.meta.language} · ${DATA.meta.total} declarations` + (DATA.meta.shown < DATA.meta.total ? ` (the ${DATA.meta.shown} most connected are drawn)` : '');

// ── svg helpers ─────────────────────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}, ...kids) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); for (const k of kids) e.append(k); return e; };
const root = document.getElementById('root'), svg = document.getElementById('svg'), canvas = document.getElementById('canvas');
let view = { x: 0, y: 0, k: 1 };
const applyView = () => root.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
canvas.addEventListener('wheel', e => { e.preventDefault(); const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; const k = Math.min(6, Math.max(.08, view.k * (e.deltaY < 0 ? 1.12 : 0.89))); view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; applyView(); }, { passive: false });
let drag = null; canvas.addEventListener('mousedown', e => { if (e.target.closest('.node,.cluster,.port')) return; drag = { x: e.clientX - view.x, y: e.clientY - view.y }; });
window.addEventListener('mousemove', e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); } }); window.addEventListener('mouseup', () => drag = null);
function fit(w, h, pad = 30) { const r = canvas.getBoundingClientRect(); const k = Math.min(1.6, (r.width - pad * 2) / Math.max(w, 1), (r.height - pad * 2 - 40) / Math.max(h, 1)); view = { k, x: (r.width - w * k) / 2, y: pad + (r.height - pad * 2 - 40 - h * k) / 2 }; applyView(); }

// ── shapes: what a thing IS is readable from its outline ───────────────────────────────────────
// type: class = rounded rect · interface = diamond · enum = hexagon · alias/namespace = dashed rect
// method: circle · constructor = circle with a core · module initializer = small square · entry point = triangle
// test = dashed outline, pale · library = grey square
function shape(n, r) {
  const fill = n.t ? '#fff' : col(n.c), stroke = n.t ? col(n.c) : shade(col(n.c)), dash = n.t ? '3,2' : (n.sk === 'type' || n.sk === 'namespace') ? '4,2' : '';
  const a = { class: 'shape', fill, stroke, 'stroke-width': 1.4, 'stroke-dasharray': dash, 'fill-opacity': n.t ? 1 : .9 };
  let s;
  if (n.k === 'library') s = el('rect', { ...a, x: -r, y: -r, width: 2 * r, height: 2 * r, fill: '#e7e5e4', stroke: '#a8a29e' });
  else if (n.k === 'type') {
    if (n.sk === 'interface') s = el('path', { ...a, d: `M0,${-r * 1.2} L${r * 1.2},0 L0,${r * 1.2} L${-r * 1.2},0 z` });
    else if (n.sk === 'enum') s = el('path', { ...a, d: hex(r * 1.15) });
    else s = el('rect', { ...a, x: -r * 1.25, y: -r * .95, width: 2.5 * r, height: 1.9 * r, rx: 4 });
  } else if (n.e && n.e.length) s = el('path', { ...a, d: `M${-r},${-r * 1.05} L${r * 1.15},0 L${-r},${r * 1.05} z` });
  else if (n.sk === 'module') s = el('rect', { ...a, x: -r * .85, y: -r * .85, width: 1.7 * r, height: 1.7 * r, rx: 2 });
  else s = el('circle', { ...a, r });
  const g = el('g', {}, s);
  if (n.sk === 'constructor') g.append(el('circle', { r: r * .35, fill: n.t ? col(n.c) : '#fff', 'pointer-events': 'none' }));
  return g;
}
const hex = r => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i; return `${i ? 'L' : 'M'}${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`; }).join(' ') + ' z';
function shade(h) { const n = parseInt(h.slice(1), 16), f = x => Math.max(0, Math.round(x * .72)).toString(16).padStart(2, '0'); return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255); }
function edgeStyle(l) {
  if (l.r === 'overrides') return { stroke: 'var(--hier)', dash: '5,3', marker: 'url(#arr-hollow)', w: 1.2 };
  if (l.r === 'extends') return { stroke: 'var(--hier)', dash: '', marker: 'url(#arr-hollow)', w: 1.4 };
  if (l.tier === 'known_edge') return { stroke: 'var(--edge-known)', dash: '', marker: 'url(#arr)', w: 1.2 + Math.min(1.2, Math.log2(l.w || 1) * .3) };
  if (l.tier === 'multi_inferred') return { stroke: 'var(--edge-inf)', dash: '6,3', marker: 'url(#arr)', w: 1.2 };
  return { stroke: 'var(--edge-amb)', dash: '2,3', marker: 'url(#arr)', w: 1 };
}
function legend(items) {
  const L = document.getElementById('legend'); L.innerHTML = ''; { const h = document.createElement('b'); h.textContent = 'legend'; h.onclick = () => L.classList.toggle('min'); L.append(h); }
  const sw = (n, r = 6) => { const s = el('svg', { width: 26, height: 20, viewBox: '-13 -10 26 20' }); s.append(shape(n, r)); return s; };
  const line = (l) => { const st = edgeStyle(l), s = el('svg', { width: 34, height: 12, viewBox: '0 0 34 12' }); s.append(el('path', { d: 'M1,6 L30,6', stroke: st.stroke.startsWith('var') ? getComputedStyle(document.documentElement).getPropertyValue(st.stroke.slice(4, -1)).trim() : st.stroke, 'stroke-width': st.w, 'stroke-dasharray': st.dash, fill: 'none', 'marker-end': st.marker })); return s; };
  const row = (sym, txt) => { const d = document.createElement('div'); d.className = 'row'; d.append(sym, txt); L.append(d); };
  const b = t => { const x = document.createElement('b'); x.textContent = t; L.append(x); };
  if (items.includes('shapes')) {
    b('nodes'); row(sw({ k: 'type', sk: 'class', c: 0 }), 'class'); row(sw({ k: 'type', sk: 'interface', c: 0 }), 'interface'); row(sw({ k: 'type', sk: 'enum', c: 0 }), 'enum');
    row(sw({ k: 'method', sk: 'method', c: 0 }), 'method / function'); row(sw({ k: 'method', sk: 'constructor', c: 0 }), 'constructor'); row(sw({ k: 'method', sk: 'method', c: 0, e: ['x'] }), 'entry point');
    row(sw({ k: 'method', sk: 'method', c: 0, t: 1 }), 'test (dashed)'); row(sw({ k: 'library', c: 0 }), 'library target');
  }
  if (items.includes('edges')) { b('edges'); row(line({ tier: 'known_edge' }), 'call, one resolved target'); row(line({ tier: 'multi_inferred' }), 'call, a sound set of targets'); row(line({ tier: 'x' }), 'call, declared ambiguous'); row(line({ r: 'overrides' }), 'overrides'); row(line({ r: 'extends' }), 'extends / implements'); }
  if (items.includes('comm')) { b('overview'); const d = document.createElement('div'); d.textContent = 'one box per community (Louvain over calls); edge width = call volume between them; colour is the community and is kept in every view'; L.append(d); }
}

// ── a small force layout for a few hundred boxes ───────────────────────────────────────────────
function force(items, links, { iters = 320, spring = 0.03, gravity = 0.02, W = 1400, H = 900, margin = 36 } = {}) {
  // every item is a box: hw/hh half-sizes (r is kept for callers that draw circles); separation is on the rectangles
  for (const it of items) { it.hw = it.hw || it.r; it.hh = it.hh || it.r; }
  const idx = new Map(items.map((it, i) => [it.id, i]));
  items.forEach((it, i) => { const a = i * 2.399, r = 40 * Math.sqrt(i + 1); it.x = W / 2 + r * Math.cos(a); it.y = H / 2 + r * Math.sin(a); it.vx = it.vy = 0; });
  const ls = links.map(l => [idx.get(l.s), idx.get(l.t), l.w || 1]).filter(l => l[0] != null && l[1] != null);
  for (let t = 0; t < iters; t++) {
    const T = 1 - t / iters;
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const ox = (a.hw + b.hw + margin) - Math.abs(dx), oy = (a.hh + b.hh + margin) - Math.abs(dy);
      let fx = 0, fy = 0;
      if (ox > 0 && oy > 0) { if (ox / (a.hw + b.hw) < oy / (a.hh + b.hh)) fx = Math.sign(dx || 1) * ox * .5; else fy = Math.sign(dy || 1) * oy * .5; }   // overlapping boxes: push apart on the axis with the smaller RELATIVE overlap (wide boxes would otherwise stack)
      const rep = 2200 / (d * d); fx += dx / d * rep; fy += dy / d * rep;                                                  // and a gentle general repulsion
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    for (const [i, j, w] of ls) { const a = items[i], b = items[j]; const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, want = Math.max(a.hw + b.hw, a.hh + b.hh) + margin + 40; if (d > want) { const f = spring * (d - want) * Math.min(3, .6 + Math.log2(w + 1)); a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; } }
    for (const it of items) { it.vx += (W / 2 - it.x) * gravity * .7; it.vy += (H / 2 - it.y) * gravity * 1.6; it.x += it.vx * .45 * T; it.y += it.vy * .45 * T; it.vx *= .5; it.vy *= .5; }
  }
  // a final pass that resolves any overlap left, deterministically
  for (let k = 0; k < 400; k++) { let moved = false; for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) { const a = items[i], b = items[j]; const dx = b.x - a.x, dy = b.y - a.y; const ox = (a.hw + b.hw + margin * .8) - Math.abs(dx), oy = (a.hh + b.hh + margin * .8) - Math.abs(dy); if (ox > 0 && oy > 0) { moved = true; if (ox / (a.hw + b.hw) < oy / (a.hh + b.hh)) { a.x -= Math.sign(dx || 1) * ox / 2; b.x += Math.sign(dx || 1) * ox / 2; } else { a.y -= Math.sign(dy || 1) * oy / 2; b.y += Math.sign(dy || 1) * oy / 2; } } } if (!moved) break; }
  const minx = Math.min(...items.map(i => i.x - i.hw)), miny = Math.min(...items.map(i => i.y - i.hh));
  for (const it of items) { it.x -= minx - 20; it.y -= miny - 20; }
  return { w: Math.max(...items.map(i => i.x + i.hw)) + 20, h: Math.max(...items.map(i => i.y + i.hh)) + 20 };
}
const curve = (a, b, bend = .18) => { const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y; return `M${a.x},${a.y} Q${mx - dy * bend},${my + dx * bend} ${b.x},${b.y}`; };
const clipRect = (a, b, pa, pb) => { const f = (o, t, pad) => { const dx = t.x - o.x, dy = t.y - o.y; const sx = Math.abs(dx) > 1e-6 ? (o.hw + pad) / Math.abs(dx) : 1e9, sy = Math.abs(dy) > 1e-6 ? (o.hh + pad) / Math.abs(dy) : 1e9; const s = Math.min(sx, sy); return { x: o.x + dx * s, y: o.y + dy * s }; }; return [f(a, b, pa), f(b, a, pb)]; };
const clip = (a, b, ra, rb) => { const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1; return [{ x: a.x + dx / d * ra, y: a.y + dy / d * ra }, { x: b.x - dx / d * rb, y: b.y - dy / d * rb }]; };

// ── views ───────────────────────────────────────────────────────────────────────────────────────
const crumbs = [];
function setCrumbs(list) { crumbs.length = 0; crumbs.push(...list); const c = document.getElementById('crumbs'); c.innerHTML = ''; list.forEach((it, i) => { if (i) { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; c.append(s); } const a = document.createElement('a'); a.textContent = it.label; a.title = it.label; if (i === list.length - 1) a.className = 'cur'; a.onclick = it.go; c.append(a); }); }
function clear() { root.innerHTML = ''; }

var overview = function overview_() {
  clear(); legend(['comm']);
  const MAX = 40, cs = DATA.communities.slice(0, MAX), rest = DATA.communities.slice(MAX);
  const box = c => { const r = 40 + 11 * Math.sqrt(c.size); return { r, hw: r * 1.2, hh: r * .72 }; };
  const items = cs.map(c => ({ id: c.id, c, ...box(c) }));
  if (rest.length) items.push({ id: -2, c: { id: -2, name: `${rest.length} smaller communities`, size: rest.reduce((a, c) => a + c.size, 0), types: 0, methods: 0, tests: 0, dirs: [], hubs: [] }, ...box({ size: 40 }) });
  const idOf = i => i < MAX ? i : -2;
  const agg = new Map(); for (const b of DATA.between) { const s = idOf(b.source), t = idOf(b.target); if (s === t) continue; const k = s + '>' + t; agg.set(k, (agg.get(k) || 0) + b.weight); }
  const links = [...agg].map(([k, w]) => { const [s, t] = k.split('>').map(Number); return { s, t, w }; });
  const { w, h } = force(items, links, { W: 1600, H: 1000, gravity: .015 });
  const pos = new Map(items.map(i => [i.id, i]));
  const gE = el('g'), gN = el('g'); root.append(gE, gN);
  const maxw = Math.max(1, ...links.map(l => l.w));
  for (const l of links) { const a = pos.get(l.s), b = pos.get(l.t); if (!a || !b) continue; const [p, q] = clipRect(a, b, 4, 8); gE.append(el('path', { class: 'edge', d: curve(p, q, .1), stroke: col(l.s), 'stroke-opacity': .55, 'stroke-width': 1.2 + 6 * Math.sqrt(l.w / maxw), 'marker-end': 'url(#arr)' }, el('title', {}, `${l.w} call site(s) from community ${l.s} into ${l.t}`))); }
  for (const it of items) {
    const c = it.c, g = el('g', { class: 'cluster', transform: `translate(${it.x},${it.y})` });
    const W = it.hw * 2, H = it.hh * 2;
    g.append(el('rect', { x: -W / 2, y: -H / 2, width: W, height: H, rx: 10, fill: '#fff', stroke: col(c.id), 'stroke-width': 2.2 }));
    g.append(el('rect', { x: -W / 2, y: -H / 2, width: W, height: 8, rx: 3, fill: col(c.id) }));
    const name = c.dirs[0] || c.name, fs = Math.max(14, Math.min(22, it.r / 4));
    const parts = name.split('/'), tail = parts.length > 2 ? '…/' + parts.slice(-2).join('/') : name;   // the last two path segments carry the meaning

  const li = (l, other, dir) => { const m = N.get(other); if (!m) return ''; return `<li data-n="${esc(m.id)}"><span class="tier ${l.r === 'overrides' || l.r === 'extends' ? 'dispatch' : esc(l.tier)}">${l.r === 'calls' ? esc(l.tier) : esc(l.r)}</span><span class="lbl">${esc(m.l)}</span><span class="loc">${esc(loc(m))}${l.w > 1 ? ' ×' + l.w : ''}</span></li>`; };
  const ins = (IN.get(n.id) || []), outs = (OUT.get(n.id) || []);
  S.innerHTML = `<h2>${esc(n.l)}</h2><div class="k">${esc(n.sk === n.k || !n.sk ? n.k : n.k === 'method' ? n.sk : n.sk + ' (' + n.k + ')')}${n.t ? ' · test' : ''}${n.e && n.e.length ? ' · <b>entry point</b> (' + esc(n.e.join(', ')) + ')' : ''}</div>
  <div class="mono wrap">${esc(loc(n))}${n.b > n.a ? '–' + n.b : ''}</div>${n.sig && n.sig !== n.l ? `<div class="mono wrap" style="margin-top:4px">${esc(n.sig)}</div>` : ''}
  ${c ? `<div class="k" style="margin-top:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${col(c.id)};margin-right:5px"></span><a style="cursor:pointer;text-decoration:underline" id="gocomm">community ${c.id}</a> · ${esc(c.name)}</div>` : ''}
  ${notes.map(x => `<div class="note">${esc(x)}</div>`).join('')}
  ${n.u ? `<div class="note">? <b>${n.u} unresolved call site(s)</b> in this body — written as ${esc(n.un.join(', '))}. Each MAY be a call this graph is missing.</div>` : ''}
  <h3>called by (${ins.filter(l => l.r === 'calls').length})</h3><ul>${ins.filter(l => l.r === 'calls').map(l => li(l, l.s)).join('') || '<li><span class="lbl" style="color:var(--mute)">none in the graph</span></li>'}</ul>
  <h3>calls (${outs.filter(l => l.r === 'calls').length})</h3><ul>${outs.filter(l => l.r === 'calls').map(l => li(l, l.t)).join('') || '<li><span class="lbl" style="color:var(--mute)">none in the graph</span></li>'}</ul>
  ${outs.some(l => l.r !== 'calls') ? `<h3>${n.k === 'type' ? 'extends' : 'overrides'}</h3><ul>${outs.filter(l => l.r !== 'calls').map(l => li(l, l.t)).join('')}</ul>` : ''}
  ${ins.some(l => l.r !== 'calls') ? `<h3>${n.k === 'type' ? 'subtypes' : 'overridden by'}</h3><ul>${ins.filter(l => l.r !== 'calls').map(l => li(l, l.s)).join('')}</ul>` : ''}`;
  S.querySelectorAll('li[data-n]').forEach(x => x.onclick = () => ego(x.dataset.n)); const gc = S.querySelector('#gocomm'); if (gc) gc.onclick = () => community(n.c);
}

// ── search: label · Owner.name suffix · simple name · substring ────────────────────────────────
const q = document.getElementById('q'), hits = document.getElementById('hits'); let sel = -1, cur = [];
q.oninput = () => { const s = q.value.trim().toLowerCase(); if (s.length < 2) { hits.style.display = 'none'; return; }
  const score = n => { const l = n.l.toLowerCase(); if (n.k === 'library') return 9; if (l === s) return 0; if (l.endsWith('.' + s)) return 1; if (l.split('.').pop() === s) return 2; if (l.startsWith(s)) return 3; if (l.includes(s)) return 4; if (n.f.toLowerCase().includes(s)) return 6; return 9; };
  cur = DATA.nodes.map(n => [score(n), n]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || b[1].d - a[1].d).slice(0, 14).map(x => x[1]);
  hits.innerHTML = cur.map((n, i) => `<div data-i="${i}"><span style="width:8px;height:8px;border-radius:2px;background:${col(n.c)};flex:none"></span>${esc(n.l)}<small>${esc(loc(n))}</small></div>`).join('') || '<div style="color:var(--mute)">nothing named like that</div>';
  hits.style.display = 'block'; sel = -1; hits.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => go(cur[+d.dataset.i])); };
q.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(cur.length - 1, sel + 1); mark(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); mark(); } else if (e.key === 'Enter') { if (cur[Math.max(0, sel)]) go(cur[Math.max(0, sel)]); } else if (e.key === 'Escape') hits.style.display = 'none'; };
const mark = () => hits.querySelectorAll('div[data-i]').forEach((d, i) => d.classList.toggle('sel', i === sel));
const go = n => { hits.style.display = 'none'; q.value = ''; ego(n.id); };
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.style.display = 'none'; });
// ── routing: #c=<community> / #n=<node id> open a view directly (a link that can be shared) ────────
function route() { const h = location.hash.slice(1); const m = /^([cn])=(.+)$/.exec(decodeURIComponent(h)); if (m && m[1] === 'c' && C.has(+m[2])) return community(+m[2], true); if (m && m[1] === 'n' && N.has(m[2])) return ego(m[2], true); overview(true); }
const _ov = overview, _cm = community, _eg = ego;
overview = function (fromHash) { if (!fromHash) history.replaceState(null, '', location.pathname); _ov(); };
community = function (cid, fromHash) { if (!fromHash) history.replaceState(null, '', '#c=' + cid); _cm(cid); };
ego = function (id, fromHash) { if (!fromHash) history.replaceState(null, '', '#n=' + encodeURIComponent(id)); _eg(id); };
window.addEventListener('hashchange', route);
route();
</script>
</body>
