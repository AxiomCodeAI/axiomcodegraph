# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders).
#            PYTHON USES all-python-modules.csv, *not* -types: a package of plain functions
#            has no class at all, so a types-based marker would skip whole library shards.
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures.
#            THE PREFIX MUST BE py_: the executor strips only 'lib_', so lib_py_method -> py_method.
#            Listing bare 'method' silently stages nothing and shows up as zero boundary_lib edges.
# LIB_BODY   full relation names staged EMPTY up front so their .input directives exist; the
#            stage<->solve loop fills them scoped to the frontier. GB-scale, never staged wholesale.
IR_MARKER="all-python-modules.csv"
LIB_SIG="py_module py_type py_type_base py_type_reference py_method py_method_parameter py_field py_field_position py_import py_decorator py_decorator_argument"
LIB_BODY="lib_py_expression lib_py_call_site lib_py_block lib_py_binding lib_py_scope lib_py_comment lib_py_parse_gap lib_py_type_parameter"

# ── THE STAGE↔SOLVE LOOP'S OWN PARAMETERS (#375) ─────────────────────────────
# Every one of these was hardcoded to Java's answer in run-souffle.sh, so a Python run
# read a frontier CSV that is never written, measured an empty frontier and broke out of
# the loop before staging a single body row. All eight LIB_BODY relations were created
# empty at startup and stayed empty, which is why library staging was signature-only in
# effect and every shape needing a library function's internals — a decorator supplied by
# a dependency, most commonly — was capped at a declared unknown.
#
# THE FRONTIER IS client_calls_lib, NOT a reachability relation. Java seeds from
# external_reachable_method, which engine-ii derives; `src/python/engine-ii/` does not
# exist, and run-souffle.sh states that client-only is a complete solve for Python. The
# boundary edge is therefore the whole frontier here, and it is the right one: it names
# every library method the client actually reaches. Column 4 is the callee — the relation
# is client_calls_lib(CallerProv, SiteHash, CalleeProv, LibMethodHash).
#
# THE SCOPE IS THE MODULE, NOT THE TYPE, and that is a language difference rather than a
# preference. Java keys expression rows on the owning type because every Java body lives
# in one. 16% of Python functions are module-level and every closure is nested — in the
# reproduction for #375 the decorator whose body is needed is `dlib.deco.plain`, a
# module-level function whose pyTypeLinkHash is empty, so a type-keyed filter stages
# nothing for it. The module is Python's compilation unit, it is what a `.py` file is, and
# keying on it picks up nested functions, comprehension scopes and closures without a
# second pass. Every body CSV carries pyModuleLinkHash, so one key serves all of them.
#
# THE THREE RELATIONS NOT LISTED — lib_py_block, lib_py_comment, lib_py_type_parameter —
# are read by NO rule (grep in src/python/engine/ returns nothing for any of them). They
# stay staged-empty so their .input directives exist. Filling a relation nothing consumes
# is load cost for no answer, and listing them here would claim they were considered and
# wanted rather than considered and declined.
LIB_METHOD_FACTS="lib_py_method"
LIB_FRONTIER_CSV="call-edges-lib.csv"
LIB_FRONTIER_COL=4
LIB_SCOPE_COL=22
LIB_METHOD_COL=36
LIB_BODY_MAP="lib_py_expression:all-python-expressions.csv:26:scope lib_py_call_site:all-python-call-sites.csv:11:scope lib_py_binding:all-python-bindings.csv:25:scope lib_py_scope:all-python-scopes.csv:6:scope lib_py_parse_gap:all-python-parse-gaps.csv:1:scope"
