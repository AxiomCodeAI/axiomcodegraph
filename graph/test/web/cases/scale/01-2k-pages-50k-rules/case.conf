# shape: multi-page admin templates (hundreds of pages) linking vendor sheets of tens of thousands of rules
mode=scale
gen=--pages 2000 --rules 50000 --sheets 10
kinds=page,element,class_token,stylesheet,rule,selector,declaration,loads_sheet,links_to
# SPEC 7 cost: 120 s per 1,000 pages + 60 s per 100,000 rules = 270 s
# SPEC 11.3 [iter3]: <= 270 s and peak RSS <= 3.0 GB (3.0e9 B = 2,861 MiB) at load < 8 (else a stated skip);
# storage: <= 1.5 KB per IR row, indexes <= 40% of graph.sqlite (tools/cost_budget.py)
budget_s=270
budget_rss_mb=2861
check=unknown_budget,cost_budget
