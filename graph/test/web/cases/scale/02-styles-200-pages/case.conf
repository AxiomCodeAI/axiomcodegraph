# shape: the same template shape at a size where every (selector, element) pair can be checked
mode=scale
gen=--pages 200 --rules 5000 --sheets 4
kinds=styles,cascade,var
# SPEC 7 cost: 120 s per 1,000 pages + 60 s per 100,000 rules = 27 s; doubled for the styles solve
budget_s=60
budget_rss_mb=2048
# var [iter1b]: the (use, def, page) set is 4.5M rows here (oracle count); SPEC 3.4a stores it as
# web_var_def/visible/scope under caps and exposes the rows through the view web_var: the count of the
# view must equal the oracle's AND the stored tables must stay under the caps
check=var_budget
