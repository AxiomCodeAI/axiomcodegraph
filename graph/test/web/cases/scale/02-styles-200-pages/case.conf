# shape: the same template shape at a size where every (selector, element) pair can be checked
mode=scale
gen=--pages 200 --rules 5000 --sheets 4
kinds=styles,cascade
# SPEC 7 cost: 120 s per 1,000 pages + 60 s per 100,000 rules = 27 s; doubled for the styles solve
budget_s=60
budget_rss_mb=2048
# var is left out on purpose: with 1,000 var() uses and ~90 definitions per name the (use, def, page)
# edge set is 4.5M rows on 200 pages (measured with the oracle) — a SPEC question, not a scale budget
