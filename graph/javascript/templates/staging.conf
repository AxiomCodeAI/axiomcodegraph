# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders).
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always.
#            THE PREFIX MUST BE js_: the executor strips only 'lib_', so lib_js_method -> js_method.
#
#            A JavaScript "library" is a dependency parsed FROM SOURCE — there are no .d.ts
#            declarations in this front end, so the signature/body split that Java and
#            TypeScript rely on does not exist: the export surface of a package IS its
#            module.exports assignments, which are expressions. Everything the client->lib
#            rules read is therefore a signature here, including js_expression (the module
#            graph lives in it, per the schema's first rule) — bounded by the fact that a
#            staged dependency is one package, never a platform image.
# LIB_BODY   full relation names staged EMPTY up front so their .input directives exist.
#            Blocks, comments and parse gaps are never read by a resolution rule.
IR_MARKER="all-javascript-modules.csv"
LIB_SIG="js_module js_package_entry js_scope js_type js_type_heritage js_method js_method_parameter js_field js_variable js_import js_export js_expression js_call_site js_type_reference"
LIB_BODY="lib_js_block lib_js_comment lib_js_parse_gap"
# The stage<->solve loop (Java's JDK frontier) is inert here, as it is for TypeScript: no
# JavaScript rule writes the frontier CSV, so the executor sees an empty frontier and
# converges after one solve.
