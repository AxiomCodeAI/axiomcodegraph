# ─────────────────────────────────────────────────────────────────────────────
# The prebuilt-engine contract. Sourced by run-souffle.sh and by the CI workflows.
#
# SOUFFLE_VERSION is PINNED here, not read from a `souffle --version`, because the machine
# that runs a prebuilt binary has no souffle to ask — and the engine id it computes must be
# the id CI computed. Bumping it changes every language's id, which is what a new code
# generator should do. CI installs exactly this version.
#
# ENGINE_PACKAGE_SCOPE is the npm scope the engine packages are published under:
# <scope>/engine-<os>-<cpu> (darwin-arm64, linux-x64, linux-arm64, win32-x64), each holding
# every language's engine for that platform under <lang>/ with its ENGINE_ID. This package
# lists them as optionalDependencies, so `npm install` fetches the one for the machine.
# ─────────────────────────────────────────────────────────────────────────────
SOUFFLE_VERSION="2.5"
ENGINE_PACKAGE_SCOPE="@axiomcode"
