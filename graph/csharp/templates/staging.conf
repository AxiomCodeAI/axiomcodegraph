# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders).
#            C# USES all-csharp-modules.csv, not -types: a C# 12 file of top-level statements
#            declares no type at all, and neither does a file that is only global usings, so a
#            types-based marker would skip whole library shards. Every .cs file the parser reads
#            produces exactly one cs_module row, so the modules file is the one that is never
#            legitimately empty.
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures.
#            THE PREFIX MUST BE cs_: the executor strips only 'lib_', so lib_cs_method -> cs_method.
#            Listing bare 'method' silently stages nothing and shows up as zero boundary_lib edges.
# LIB_BODY   full relation names staged EMPTY up front so their .input directives exist; the
#            stage<->solve loop fills them scoped to the frontier. Never staged wholesale.
IR_MARKER="all-csharp-modules.csv"

# ── WHAT A SIGNATURE IS, FOR C# ──────────────────────────────────────────────────────────────
# cs_property AND cs_event are signatures here, which they would not be in Java. A C# property
# is the ordinary way to expose state, `x.Name` is a CALL to get_Name, and the parser gives the
# accessor its own cs_method row with isAccessor=true plus ownerMemberLinkHash pointing at the
# property. A library whose properties were not staged answers "no such member" for the most
# common member access in the language. An event is the same argument for `+=` / `-=`.
#
# cs_type_heritage is a signature because a C# heritage clause does NOT say whether the name is
# a base class or an interface (heritageKind is BASE_OR_INTERFACE for both, by construction -
# syntax cannot tell them apart). Deciding that needs the NAMED type's own typeCategory, so a
# client type extending a library type cannot be placed in the hierarchy without the library's
# type rows AND its heritage rows.
LIB_SIG="cs_module cs_type cs_type_heritage cs_type_parameter cs_type_reference cs_method cs_method_parameter cs_property cs_event cs_field cs_enum_member cs_using cs_attribute cs_attribute_argument"
LIB_BODY="lib_cs_expression lib_cs_call_site lib_cs_block lib_cs_variable lib_cs_query_clause lib_cs_comment lib_cs_parse_gap lib_cs_preproc_region"

# ── THE STAGE↔SOLVE LOOP'S OWN PARAMETERS ────────────────────────────────────────────────────
# THE FRONTIER IS client_calls_lib, as it is for Python: `graph/csharp/engine-ii/` does not
# exist, so the boundary edge is the whole frontier. Column 4 is the callee - the relation is
# client_calls_lib(CallerProv, SiteHash, CalleeProv, LibMethodHash).
#
# THE SCOPE IS THE MODULE, NOT THE TYPE. A C# body does not always live in a type: top-level
# statements (C# 9) put executable code directly in a compilation unit, and the parser models
# that with csTypeLinkHash empty on the synthetic entry method, so a type-keyed filter stages
# nothing for it. The module is also what a `.cs` file is, and keying on it picks up local
# functions, lambdas and nested types in one pass. Every body CSV carries csModuleLinkHash.
LIB_METHOD_FACTS="lib_cs_method"
LIB_FRONTIER_CSV="call-edges-lib.csv"
LIB_FRONTIER_COL=4
# cs_method c21 = csModuleLinkHash (1-based column 22); c34 = csMethodUniqueHash (1-based 35).
LIB_SCOPE_COL=22
LIB_METHOD_COL=35
# relation:csv:module-column(1-based):scope
LIB_BODY_MAP="lib_cs_expression:all-csharp-expressions.csv:10:scope lib_cs_call_site:all-csharp-call-sites.csv:7:scope lib_cs_block:all-csharp-blocks.csv:6:scope lib_cs_variable:all-csharp-variables.csv:16:scope lib_cs_parse_gap:all-csharp-parse-gaps.csv:1:scope"
