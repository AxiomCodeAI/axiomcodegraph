# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders)
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures
# LIB_BODY   full relation names staged empty up front, then filled scoped by the stage↔solve
#            loop; these are GB-scale bodies, never staged wholesale
IR_MARKER="all-types.csv"
LIB_SIG="annotation annotation_argument type type_lines type_reference type_parameter method method_parameter method_type_parameter field field_position import enum_constant service_descriptor service_provider property_key property_value_segment"
LIB_BODY="lib_expression lib_local_variable lib_block"

# ── THE STAGE↔SOLVE LOOP'S OWN PARAMETERS ───────────────────────────────────
# These were hardcoded in run-souffle.sh, which made the loop Java-only in a shared
# executor: another language's run read a frontier CSV that is never written, saw an
# empty frontier, and broke out before staging anything. See #375.
#
# LIB_FRONTIER_CSV  output naming the library methods reached so far, and LIB_FRONTIER_COL
#                   the 1-based column in it holding the method hash.
# LIB_SCOPE_COL     column of the lib method facts holding the STAGING SCOPE a body row is
#                   matched by. Java's is the owning TYPE: a class is the unit whose bodies
#                   are wanted together.
# LIB_METHOD_COL    column of the lib method facts holding the method's own hash.
# LIB_BODY_MAP      one `relation:csv:column:key` per body relation, where key is `scope`
#                   (match the row's column against the reached scopes) or `method`
#                   (against the methods inside them).
LIB_METHOD_FACTS="lib_method"
LIB_FRONTIER_CSV="external-reachable-method.csv"
LIB_FRONTIER_COL=1
LIB_SCOPE_COL=8
LIB_METHOD_COL=22
LIB_BODY_MAP="lib_expression:all-expressions.csv:5:scope lib_local_variable:all-local-variables.csv:14:method lib_block:all-blocks.csv:10:method"
