# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module. The web IR has no library side, so the
#            marker is only read for a --library root, which web never stages.
# LIB_SIG    empty: no relation is staged from a library (SPEC D3).
# LIB_BODY   empty.
# No LIB_FRONTIER_*: one solve.
IR_MARKER="all-html-documents.csv"
LIB_SIG=""
LIB_BODY=""
