# ─────────────────────────────────────────────────────────────────────────────
# CI — the gate every change to main passes through.
#
# Three tiers, cheapest first, all required:
#   build     the TypeScript driver compiles and typechecks
#   hygiene   repo invariants that need no parser and catch silent breakage
#   engine    the java / python / typescript regression suites, in parallel
#
# NO PATH FILTERS, deliberately. A required check that is skipped by a path
# filter never reports, and a pull request waiting on a check that will never
# report can never merge. Correctness beats the saved minutes.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# One run per ref. A new push to a pull request cancels the previous run, but a
# run on main is always allowed to finish — main's history is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  SOUFFLE_VERSION: '2.5'
  SOUFFLE_SHA512: '6b86e554f6aa5abf8a8b55d8312ae37c0957c5bd6c9edeea89246db9406f645ec5e600b84fe6636b1c163da556f0da6c3d2dad46c1083413f2fcf4f95b9ac62c'

jobs:
  build:
    name: build & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `npm ci` runs the `prepare` script, which builds. Keeping the explicit
      # build step anyway means a prepare-script change cannot silently stop
      # compiling this repo.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  hygiene:
    name: repo invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A fixture input that .gitignore matches passes on the machine that wrote
      # it and fails on every clone. The suites run this too; running it here as
      # well means the answer arrives in seconds rather than after the engine.
      - name: every fixture input is tracked by git
        run: bash test/tools/no-ignored-fixtures.sh

      # A relation staged for the client but not for libraries is EMPTY on every
      # run and nothing errors — no golden can see it. This is the only check
      # that can.
      - name: IR staging maps are consistent
        run: |
          fail=0
          for lang in java python typescript; do
            echo "── $lang"
            python3 test/tools/check_staging.py --lang "$lang" || fail=1
          done
          exit $fail

      # The client->library half is carried by a smaller set of fixtures than the
      # client->client half, and it is the half that disappears silently: delete a
      # golden and the case still runs, still passes, and simply stops claiming
      # anything. A suite can only check the assertions it still has.
      - name: client->library coverage has not shrunk
        run: bash test/tools/lib-coverage.sh

      - name: shell scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

  engine:
    name: engine (${{ matrix.lang }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --oracle scores the engine against GROUND TRUTH, not only against the
          # goldens. A golden says "the same as last time", which a wrong answer
          # satisfies perfectly well as long as it was wrong last time too.
          #
          # The ground truth is built with the toolchain that defines the language:
          # javac and javap for Java, the TypeScript compiler for TypeScript. No
          # third-party analyzer, and no third-party library is downloaded to do it.
          # A case whose ground truth would need an external classpath reports
          # itself unscored rather than pulling one in.
          # --no-torture for java ONLY. Those families call java.util.List, Map and
          # the functional interfaces, so they need the JVM platform IR staged as a
          # library. That IR is 1.8 GB and is built from a JDK source checkout, so it
          # cannot live in a repository or a cache. Without it those receivers are
          # unresolvable BY CONSTRUCTION — the census goes from 10 missing edges to
          # 23 and recall to 0.847 — which measures the staging, not the rules, and
          # the resulting red would read as a regression in whatever PR met it.
          #
          # Java client->library resolution is still covered here: six cases ship
          # their own stub library in lib-src/ and are solved with it as --library.
          # The torture families remain a local gate until the platform IR can be
          # produced reproducibly; the suite prints EXCLUDED so it is never mistaken
          # for a family that passed.
          - lang: java
            oracle: '--oracle --no-torture'
          - lang: typescript
            oracle: '--oracle'
          # Python's ground truth is frozen CPython output, authored by a separate
          # harness that CI cannot reach yet, so this leg is goldens-only for now.
          # That separation is deliberate — test/python/run-tests.sh explains why
          # the ability to re-bless ground truth must not sit beside the code under
          # test — but it does mean the python leg is a weaker check than the other
          # two until the harness is reachable from here.
          - lang: python
            oracle: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The TypeScript ground-truth oracle runs the compiler from this repo's own
      # devDependencies. Without this, every case reports "oracle refused".
      - run: npm ci

      # The python suite's tier-1 attribution preflight reads CPython opcodes,
      # which are not stable across minor versions. 3.10 is the pinned one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # JDK 24, not the runner's default. The java torture harness reads class files
      # with java.lang.classfile, which is not final before 24 — on an older JDK it
      # exits 77 and the whole ten-family oracle silently does not run.
      - uses: actions/setup-java@v4
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: '24'

      - name: cache the Soufflé package
        uses: actions/cache@v4
        with:
          path: ~/souffle-pkg
          key: souffle-deb-${{ env.SOUFFLE_VERSION }}-ubuntu-2404

      # Soufflé is the solver, not a library under test: the engine is compiled
      # from .dl to C++ and linked against Soufflé's headers, so a build of it has
      # to be present the way a compiler has to be present.
      #
      # It is pinned to an exact version AND verified against the checksum upstream
      # published for that release, so what CI links against is decided in this
      # file rather than by whatever the archive happens to serve today. Building
      # it from source instead would take roughly twenty minutes a run and buy
      # nothing unless this project ever needs a patched solver.
      - name: install Soufflé ${{ env.SOUFFLE_VERSION }}
        run: |
          set -euo pipefail
          deb="x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb"
          dir="$HOME/souffle-pkg"; mkdir -p "$dir"
          if [ ! -f "$dir/$deb" ]; then
            curl -fsSL --retry 3 -o "$dir/$deb" \
              "https://github.com/souffle-lang/souffle/releases/download/${SOUFFLE_VERSION}/${deb}"
          fi
          echo "${SOUFFLE_SHA512}  ${dir}/${deb}" | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$dir/$deb"
          souffle --version | head -2

      # ── the parser ─────────────────────────────────────────────────────────
      # A separate repository, pinned by commit in .github/parser-ref, so that a
      # change there cannot turn this repository red with no commit here to point
      # at. The nightly parser-drift workflow is what notices the pin has aged.
      - name: read the pinned parser ref
        id: parser
        run: |
          set -euo pipefail
          ref="$(grep -vE '^\s*(#|$)' .github/parser-ref | head -1 | tr -d '[:space:]')"
          [ -n "$ref" ] || { echo "::error::.github/parser-ref is empty"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "parser pinned at $ref"

      # Fail here, with a sentence that says what is wrong, rather than thirty
      # lines later as an unexplained checkout error.
      - name: the parser credential is present
        env:
          TOKEN: ${{ secrets.PARSER_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::secret PARSER_TOKEN is not set, so the parser cannot be" \
                 "fetched and every suite would skip itself. Pull requests opened from" \
                 "a fork do not receive secrets, by design — run such a change from a" \
                 "branch in this repository."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: AxiomCodeAI/parser
          ref: ${{ steps.parser.outputs.ref }}
          token: ${{ secrets.PARSER_TOKEN }}
          path: .parser

      # tree-sitter builds native addons, which is the slow part. Keyed on the
      # pinned parser SHA, so a bump rebuilds and nothing else does.
      - name: cache the built parser
        id: parser-cache
        uses: actions/cache@v4
        with:
          path: |
            .parser/node_modules
            .parser/dist
          key: parser-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ steps.parser.outputs.ref }}

      # ALWAYS build when the cache missed. A stale dist/ scores stale IR and the
      # goldens move for a reason that is not in any diff.
      - name: build the parser
        if: steps.parser-cache.outputs.cache-hit != 'true'
        working-directory: .parser
        run: |
          npm ci
          npm run build

      - name: the parser actually built
        run: |
          test -f .parser/dist/index.js \
            || { echo "::error::.parser/dist/index.js is missing after build"; exit 1; }
          echo "parser $(cd .parser && git rev-parse --short HEAD) built"

      # ── the compiled engine ────────────────────────────────────────────────
      # run-souffle.sh caches the compiled solver under a content hash of the
      # .dl program text. Mirroring that key here skips a multi-minute C++ build
      # on every run whose rules did not change.
      - name: cache the compiled Soufflé engine
        uses: actions/cache@v4
        with:
          path: .souffle-cache
          key: souffle-${{ env.SOUFFLE_VERSION }}-${{ matrix.lang }}-${{ hashFiles('src/**/*.dl') }}
          restore-keys: |
            souffle-${{ env.SOUFFLE_VERSION }}-${{ matrix.lang }}-

      - name: ${{ matrix.lang }} regression suite
        env:
          AXIOM_PARSER: ${{ github.workspace }}/.parser/dist/index.js
        run: bash .github/scripts/run-suite.sh ${{ matrix.lang }} ${{ matrix.oracle }}

  # A single job the branch ruleset can require. Without it, every new matrix
  # entry has to be added to the protection rules by hand, and a matrix job that
  # fails to start reports nothing at all — which a ruleset reads as "not
  # failing" rather than as "did not run".
  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [build, hygiene, engine]
    if: always()
    steps:
      - name: every required job succeeded
        run: |
          # The expression quotes its separator with SINGLE quotes because that is
          # the only string delimiter a GitHub expression has. A double quote there
          # is a lex error that invalidates the entire workflow file, and the run
          # then fails in zero seconds with no job having started.
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job reported '$r'"; exit 1; }
          done
          echo "all required jobs passed"
