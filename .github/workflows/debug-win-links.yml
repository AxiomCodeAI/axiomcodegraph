name: debug-win-links
on:
  push:
    branches: [debug/win-asserted-links]
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        scripts: [dev]
        round: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: plugin scripts of ${{ matrix.scripts }}
        if: matrix.scripts == 'pre-0.2.4'
        shell: bash
        run: git checkout 45ee8b1b -- plugins/axiomcode tests/run.py
      - name: install the 0.2.3 engine
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error @axiomcode/code-graph@0.2.3
          echo "AXIOMCODE_ENGINE=$RUNNER_TEMP/proj/node_modules/@axiomcode/code-graph" >> "$GITHUB_ENV"
      - name: every python case, 4 at a time, as the nightly runs them
        shell: bash
        env: { PYTHONUTF8: '1' }
        run: |
          . graph/test/tools/hide-souffle.sh || true
          export AXIOMCODE_BASH="$(cygpath -m "$BASH")"
          python tests/run.py --lang python --jobs 4 --keep 2>&1 | grep -E "FAIL|missing/unwanted|check\(s\) passed" | head -20 || true
          d=tests/cases/python/asserted-links/.axiomcode
          echo "--- TRACE"; cat $d/TRACE.log; echo "--- refresh.log"; cat $d/refresh.log; echo "--- refresh.json"; cat $d/refresh.json
