# ─────────────────────────────────────────────────────────────────────────────
# Build the engine binaries — every language, every platform — as artifacts.
#
# Reusable (workflow_call) so publish-npm.yml can build then publish in one run, and
# dispatchable on its own to check that the rules still compile everywhere without
# publishing anything. Soufflé is a BUILD-time dependency only: `souffle -g` turns each
# language's rules into portable C++ once on Ubuntu (the pinned .deb), and every platform
# compiles that C++ with its own C++17 compiler against Soufflé's headers. The result is
# one self-contained executable per language per platform, linked against nothing but the
# C++ runtime. Same flags as the local compile (no OpenMP/zlib/sqlite), portable targets.
#
# Artifacts: engines-<platform>/  holding <lang>/axiomcode-engine-<lang>[.exe] + <lang>/ENGINE_ID,
# and queries/axiomcode-query-<name>[.exe] + queries/<name>.id for every query program the CLI
# runs (plugins/axiomcode/skills/axiomcode/scripts/dl/<name>.dl: impact, path, path-opt,
# path-every). Without those, `axiomcode impact` needs Soufflé and a C++ compiler on the user's
# machine (#1330). A query binary's id is dl_program.py's own key, so the CLI finds it by the
# same hash it would cache a local compile under.
# Platforms are named the npm way (process.platform-process.arch): darwin-arm64, darwin-x64,
# linux-x64, linux-arm64, win32-x64, each on a standard GitHub-hosted runner (free for a
# public repository; macOS builds on macos-15 for Apple Silicon and macos-15-intel for Intel).
# ─────────────────────────────────────────────────────────────────────────────
name: build-engines

on:
  workflow_call:
    inputs:
      # fresh: compile every engine, restore nothing. The nightly and a release use it.
      fresh:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      fresh:
        type: boolean
        default: false

# COMPILED ENGINES ARE CACHED BY ENGINE_ID. Compiling one language's C++ at -O3 takes
# about three minutes, and a run that changed no rules used to recompile all five on
# every platform. Each platform now restores its last engines and recompiles only the
# languages whose ENGINE_ID — a hash of that language's rules and the Soufflé version —
# differs from the one the restored binary records. A binary is therefore reused only
# for exactly the rules it was built from; the smoke step still runs every one.

env:
  LANGUAGES: java typescript python javascript csharp
  # Same pin and checksum as ci.yml: the tool that produces the published binaries is
  # verified against what upstream published for that release.
  SOUFFLE_SHA512: '6b86e554f6aa5abf8a8b55d8312ae37c0957c5bd6c9edeea89246db9406f645ec5e600b84fe6636b1c163da556f0da6c3d2dad46c1083413f2fcf4f95b9ac62c'

jobs:
  generate:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.gen.outputs.key }}
      flags: ${{ steps.gen.outputs.flags }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Soufflé
        run: |
          . graph/pipeline/engine.conf
          deb="x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb"
          curl -fsSL --retry 3 -o "/tmp/$deb" "https://github.com/souffle-lang/souffle/releases/download/${SOUFFLE_VERSION}/$deb"
          echo "${SOUFFLE_SHA512}  /tmp/$deb" | sha512sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq "/tmp/$deb"
          souffle --version | head -2
          test -f /usr/include/souffle/CompiledSouffle.h
      - name: Generate portable C++ per language
        id: gen
        run: |
          set -e
          mkdir -p gen
          for lang in $LANGUAGES; do
            id="$(bash graph/pipeline/run-souffle.sh --language "$lang" --print-engine-id)"
            echo "$lang: $id"; printf '%s' "$id" > "gen/$lang.id"
            bash graph/pipeline/run-souffle.sh --language "$lang" --emit-program "gen/$lang.dl"
            # -j makes souffle EMIT the parallel loops (without it the C++ has none); whether a
            # platform's binary runs them in parallel is decided at compile time below.
            souffle -I graph -j 8 -g "gen/$lang.cpp" "gen/$lang.dl" 2> "gen/$lang.gen.log" || { cat "gen/$lang.gen.log"; exit 1; }
            awk '/No rules\/facts defined/{skip=2;next} skip>0{skip--;next} {print}' "gen/$lang.gen.log"
          done
          # the query programs: self-contained (no #include), keyed by dl_program.py itself
          mkdir -p gen/queries
          for dl in plugins/axiomcode/skills/axiomcode/scripts/dl/*.dl; do
            q="$(basename "$dl" .dl)"
            python3 plugins/axiomcode/skills/axiomcode/scripts/dl_program.py --print-id "$dl" | tr -d '\n' > "gen/queries/$q.id"
            echo "query $q: $(cat "gen/queries/$q.id")"
            cp "$dl" "gen/queries/$q.dl"
            souffle -g "gen/queries/$q.cpp" "$dl" 2> "gen/queries/$q.gen.log" || { cat "gen/queries/$q.gen.log"; exit 1; }
          done
          # the fixture and what the interpreter derives from it; each platform's binaries must match
          bash .github/scripts/query-smoke.sh expect gen/queries
          cp .github/scripts/query-smoke.sh gen/queries/smoke.sh
          cp -r /usr/include/souffle gen/souffle
          # the seqlock fix (see souffle_overlay in run-souffle.sh): the write-entry RMW
          # must be seq_cst or a weakly-ordered CPU lets data stores pass the version-odd
          # store and readers validate garbage. Patched here so every platform's binary
          # is built from the same fixed headers; the engine id carries +seqlock-fix-4,
          # so these headers must carry the SAME patches run-souffle's overlay applies —
          # a binary labeled fix-4 but built from lesser headers is the exact mislabeling
          # the salt exists to prevent.
          # the header layout differs by install (deb: souffle/utility; brew: souffle/souffle/utility),
          # so the patched files are FOUND, not assumed — a miss fails the build here, loudly
          PU=$(find gen/souffle -name ParallelUtil.h | head -1); [ -n "$PU" ]
          sed -i 's/version\.fetch_or(0x1, std::memory_order_acquire)/version.fetch_or(0x1, std::memory_order_seq_cst)/g' "$PU"
          grep -q 'fetch_or(0x1, std::memory_order_seq_cst)' "$PU"
          ! grep -q 'fetch_or(0x1, std::memory_order_acquire)' "$PU"
          # fix-3: the publication fences, applied by the same anchored patch the local
          # overlay uses (extracted from run-souffle.sh so the two cannot drift)
          BT=$(find gen/souffle -name BTree.h | head -1); [ -n "$BT" ]
          awk '/^import glob, os, sys$/,/^PYEOF$/' graph/pipeline/run-souffle.sh | sed '$d' > /tmp/fences.py
          python3 /tmp/fences.py "$BT"
          [ "$(grep -c 'seqlock-fix-3' "$BT")" = "4" ]
          # fix-4: the speculative-fetch guards, applied by the same extracted patch
          FW=$(find gen/souffle -name ConcurrentFlyweight.h | head -1); [ -n "$FW" ]
          RT=$(find gen/souffle -name RecordTableImpl.h | head -1); [ -n "$RT" ]
          [ "$(grep -c 'seqlock-fix-4' "$FW")" = "1" ]
          [ "$(grep -c 'seqlock-fix-4' "$RT")" = "1" ]
          [ "$(grep -c 'seqlock-fix-4' "$BT")" = "1" ]
          BD=$(find gen/souffle -name BTreeDelete.h | head -1); [ -n "$BD" ]
          [ "$(grep -c 'seqlock-fix-4' "$BD")" = "1" ]
          # one key for the whole set; a partial match restores the previous set
          echo "key=$(cat gen/*.id gen/queries/*.id | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The compile flags live in THIS file and ENGINE_ID does not cover them, so its
          # hash prefixes the key AND the restore prefix: a flag change restores nothing.
          # Computed here because the build jobs never check the repository out.
          echo "flags=$(sha256sum .github/workflows/build-engines.yml | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: generated, path: gen, retention-days: 3, if-no-files-found: error }

  build:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-24.04,     platform: linux-x64,   manylinux: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, manylinux: quay.io/pypa/manylinux_2_28_aarch64 }
          - { os: windows-2025,     platform: win32-x64 }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: generated, path: gen }
      - name: restore the engines built from these rules last time
        id: restore
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: engines
          key: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-${{ needs.generate.outputs.key }}
          restore-keys: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-
      # THE GLIBC FLOOR. A binary links against the glibc of the machine that built it, and runs only where that
      # glibc or a newer one is installed. Built on ubuntu-24.04 (glibc 2.39) every engine needed GLIBC_2.38, so it
      # would not start on Ubuntu 22.04, Debian 12, RHEL 9 or Amazon Linux 2023: the official python and node
      # Docker images, most CI and most servers. The compile therefore runs inside manylinux_2_28 (glibc 2.28,
      # the floor Python wheels use), and the step after it fails the build if any binary asks for more.
      - name: Compile every language (Linux, manylinux_2_28)
        if: startsWith(matrix.target.platform, 'linux')
        env:
          MANYLINUX: ${{ matrix.target.manylinux }}
        run: |
          set -e
          docker run --rm -v "$PWD:/w" -w /w -e LANGUAGES="$LANGUAGES" -u "$(id -u):$(id -g)" "$MANYLINUX" bash -ec '
          c++ --version | head -1; ldd --version | head -1
          for lang in $LANGUAGES; do
            if cmp -s "gen/$lang.id" "engines/$lang/ENGINE_ID"; then echo "$lang: cached, rules unchanged"; continue; fi
            mkdir -p "engines/$lang"
            # OpenMP on BOTH architectures: the arm64 crash mode was two weak-ordering
            # holes in the vendored headers (write-entry RMW + unfenced node publication),
            # both patched above and validated 10/10 under load on linux-arm64 and
            # darwin-arm64 (seqlock-fix-3). libgomp links STATICALLY so the binary runs on
            # machines with no gcc runtime. The .parallel marker beside the binary is what
            # run-souffle.sh reads to pass a real -j at run time.
            OMP="-fopenmp -Wl,-Bstatic,-lgomp,-Bdynamic"
            c++ -std=c++17 -O3 -w $OMP -static-libstdc++ -static-libgcc -I gen "gen/$lang.cpp" -o "engines/$lang/axiomcode-engine-$lang"
            [ -n "$OMP" ] && touch "engines/$lang/axiomcode-engine-$lang.parallel"
            cp "gen/$lang.id" "engines/$lang/ENGINE_ID"
          done
          mkdir -p engines/queries
          for cpp in gen/queries/*.cpp; do
            q="$(basename "$cpp" .cpp)"
            if cmp -s "gen/queries/$q.id" "engines/queries/$q.id"; then echo "query $q: cached, rules unchanged"; continue; fi
            c++ -std=c++17 -O3 -w -static-libstdc++ -static-libgcc -I gen "$cpp" -o "engines/queries/axiomcode-query-$q"
            cp "gen/queries/$q.id" "engines/queries/$q.id"
          done
          '
          ls -la engines/*; ldd engines/java/axiomcode-engine-java || true
      - name: Linux binaries need no glibc newer than 2.28
        if: startsWith(matrix.target.platform, 'linux')
        run: |
          set -e
          bad=0
          for f in engines/*/axiomcode-*; do
            need="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
            echo "$f needs glibc $need"
            if [ "$(printf '%s\n2.28\n' "$need" | sort -V | tail -1)" != 2.28 ]; then echo "::error::$f needs glibc $need (> 2.28)"; bad=1; fi
          done
          exit $bad
      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.target.platform, 'win32')
        with: { arch: x64 }
      - name: Compile every language (Windows, MSVC)
        if: startsWith(matrix.target.platform, 'win32')
        shell: cmd
        run: |
          for %%L in (java typescript python javascript csharp) do (
            fc /b gen\%%L.id engines\%%L\ENGINE_ID >nul 2>&1
            if errorlevel 1 (
              if not exist engines\%%L mkdir engines\%%L
              cl /nologo /std:c++17 /O2 /EHsc /bigobj /w /permissive- /Zc:__cplusplus /D_CRT_SECURE_NO_WARNINGS /DNOMINMAX /DUSE_CUSTOM_GETOPTLONG /openmp /I gen gen\%%L.cpp /Fe:engines\%%L\axiomcode-engine-%%L.exe
              if errorlevel 1 exit /b 1
              type nul > engines\%%L\axiomcode-engine-%%L.exe.parallel
              copy /y gen\%%L.id engines\%%L\ENGINE_ID
            ) else (
              echo %%L: cached, rules unchanged
            )
          )
          if not exist engines\queries mkdir engines\queries
          for %%Q in (gen\queries\*.cpp) do (
            fc /b gen\queries\%%~nQ.id engines\queries\%%~nQ.id >nul 2>&1
            if errorlevel 1 (
              cl /nologo /std:c++17 /O2 /EHsc /bigobj /w /permissive- /Zc:__cplusplus /D_CRT_SECURE_NO_WARNINGS /DNOMINMAX /DUSE_CUSTOM_GETOPTLONG /I gen %%Q /Fe:engines\queries\axiomcode-query-%%~nQ.exe
              if errorlevel 1 exit /b 1
              copy /y gen\queries\%%~nQ.id engines\queries\%%~nQ.id
            ) else (
              echo query %%~nQ: cached, rules unchanged
            )
          )
          dir /s engines
      - name: Smoke — every binary starts on empty inputs
        shell: bash
        run: |
          set -e
          for lang in $LANGUAGES; do
            bin="$(ls engines/$lang/axiomcode-engine-$lang* )"; chmod +x "$bin" 2>/dev/null || true
            mkdir -p "facts-$lang" "out-$lang"
            sed -n 's/^\.input \([A-Za-z0-9_]*\)(.*/\1/p' "gen/$lang.dl" | while read -r r; do : > "facts-$lang/$r.facts"; done
            "./$bin" -F "facts-$lang" -D "out-$lang"
            echo "$lang: ok ($(ls out-$lang | wc -l) relations written)"
          done
          bash gen/queries/smoke.sh check gen/queries engines/queries
      - name: save the engines for the next run
        if: ${{ !inputs.fresh && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: engines
          key: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-${{ needs.generate.outputs.key }}
      # publish-npm ships these binaries from the release's CI run, whenever the draft is published
      - uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.target.platform }}
          path: engines
          retention-days: 90
          if-no-files-found: error

  build-macos:
    needs: generate
    strategy:
      fail-fast: false
      matrix:
        target:
          # each on its own architecture's runner, so the smoke step runs the binary natively
          - { os: macos-15,       arch: arm64,  platform: darwin-arm64 }
          - { os: macos-15-intel, arch: x86_64, platform: darwin-x64 }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: generated, path: gen }
      - name: restore the engines built from these rules last time
        id: restore
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: engines
          key: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-${{ needs.generate.outputs.key }}
          restore-keys: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-
      - name: Compile every language (macOS ${{ matrix.target.arch }})
        env:
          ARCH: ${{ matrix.target.arch }}
        run: |
          set -e
          for lang in $LANGUAGES; do
            if cmp -s "gen/$lang.id" "engines/$lang/ENGINE_ID"; then echo "$lang: cached, rules unchanged"; continue; fi
            mkdir -p "engines/$lang"
            c++ -std=c++17 -O3 -w -arch "$ARCH" -mmacosx-version-min=12.0 -I gen "gen/$lang.cpp" -o "engines/$lang/axiomcode-engine-$lang"
            cp "gen/$lang.id" "engines/$lang/ENGINE_ID"
          done
          mkdir -p engines/queries
          for cpp in gen/queries/*.cpp; do
            q="$(basename "$cpp" .cpp)"
            if cmp -s "gen/queries/$q.id" "engines/queries/$q.id"; then echo "query $q: cached, rules unchanged"; continue; fi
            c++ -std=c++17 -O3 -w -arch "$ARCH" -mmacosx-version-min=12.0 -I gen "$cpp" -o "engines/queries/axiomcode-query-$q"
            cp "gen/queries/$q.id" "engines/queries/$q.id"
          done
          file engines/java/axiomcode-engine-java
          otool -L engines/java/axiomcode-engine-java
      - name: Smoke — every binary starts on empty inputs
        run: |
          set -e
          for lang in $LANGUAGES; do
            mkdir -p "facts-$lang" "out-$lang"
            sed -n 's/^\.input \([A-Za-z0-9_]*\)(.*/\1/p' "gen/$lang.dl" | while read -r r; do : > "facts-$lang/$r.facts"; done
            "./engines/$lang/axiomcode-engine-$lang" -F "facts-$lang" -D "out-$lang"
          done
          bash gen/queries/smoke.sh check gen/queries engines/queries
      - name: save the engines for the next run
        if: ${{ !inputs.fresh && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: engines
          key: engines-${{ matrix.target.platform }}-${{ needs.generate.outputs.flags }}-${{ needs.generate.outputs.key }}
      - uses: actions/upload-artifact@v4
        with: { name: 'engines-${{ matrix.target.platform }}', path: engines, retention-days: 90, if-no-files-found: error }
