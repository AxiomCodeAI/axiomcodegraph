# ─────────────────────────────────────────────────────────────────────────────
# Prebuilt engine binaries — so running the engine needs no Soufflé and no compiler.
#
# EVERY merge to main runs this. Each language's engine id (src/pipeline/run-souffle.sh
# --print-engine-id) is a hash of that language's rules alone, so the plan step decides per
# language: an id equal to the one recorded in engine/binaries/<lang>/ENGINE_ID is unchanged
# and skipped; any other id is built on every platform. A Python-only merge therefore rebuilds
# Python on all four targets and nothing else; a merge touching no rule set builds nothing and
# finishes in seconds. For each language that needs building:
#   generate  Ubuntu + the pinned Soufflé .deb: emit the program, `souffle -g` it to portable
#             C++ once, and capture the header tree the C++ compiles against.
#   build     compile that C++ on every platform with the SAME flags the script uses locally
#             (-std=c++17 -O3, no OpenMP/zlib/sqlite defines — the binary links against nothing
#             but the C++ runtime). Portable target: no -march=native.
#   publish   COMMIT the binaries to main under engine/binaries/<lang>/<platform>/ with the id
#             they were built from in engine/binaries/<lang>/ENGINE_ID — so a checkout carries
#             its own engines and nothing is downloaded — and, as a secondary copy, a GitHub
#             release tagged engine-<lang>-<id> with the same files plus the generated .cpp.
# run-souffle.sh computes the same id on the user's machine and uses the committed binary only
# when the ids agree. The id is a function of the repository alone (see engine_id in the
# script), which is what makes "id differs" mean exactly "these rules were edited after the
# binary was built".
# ─────────────────────────────────────────────────────────────────────────────
name: engine-binaries

on:
  push:
    branches: [main]
  # No pull_request trigger: macOS minutes bill at 10x and a PR run costs ~300 billable
  # minutes. Builds happen on merge; a change to the build itself is validated with
  # workflow_dispatch on its branch when that is worth the minutes.
  workflow_dispatch:
    inputs:
      force:
        description: rebuild and re-publish even if the release for this id exists
        type: boolean
        default: false

permissions:
  contents: write

env:
  LANGUAGES: java typescript python

jobs:
  generate:
    runs-on: ubuntu-24.04
    outputs:
      langs: ${{ steps.plan.outputs.langs }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan — which languages need a build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          mkdir -p out
          langs=""
          for lang in $LANGUAGES; do
            id="$(bash src/pipeline/run-souffle.sh --language "$lang" --print-engine-id)"
            echo "$lang: $id"
            have="$(tr -d '[:space:]' < "engine/binaries/$lang/ENGINE_ID" 2>/dev/null || true)"
            if [ "$FORCE" != "true" ] && [ "${{ github.event_name }}" != "pull_request" ] && [ "$have" = "$id" ]; then
              echo "  unchanged — engine/binaries/$lang is at this id"; continue
            fi
            echo "  changed — engine/binaries/$lang is at '${have:-<none>}'; building on every platform"
            printf '%s' "$id" > "out/$lang.id"
            langs="$langs \"$lang\""
          done
          . src/pipeline/engine.conf; printf '%s' "$SOUFFLE_VERSION" > out/souffle.version
          langs="[$(echo $langs | sed 's/ /,/g')]"
          echo "langs=$langs" >> "$GITHUB_OUTPUT"
          echo "building: $langs"


      - name: Install the pinned Soufflé
        if: steps.plan.outputs.langs != '[]'
        run: |
          . src/pipeline/engine.conf
          deb="x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb"
          curl -fsSL -o "/tmp/$deb" "https://github.com/souffle-lang/souffle/releases/download/${SOUFFLE_VERSION}/$deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "/tmp/$deb"
          souffle --version | head -2
          test -f /usr/include/souffle/CompiledSouffle.h

      - name: Generate portable C++ for each language
        if: steps.plan.outputs.langs != '[]'
        run: |
          set -e
          for lang in $LANGUAGES; do
            [ -f "out/$lang.id" ] || continue
            bash src/pipeline/run-souffle.sh --language "$lang" --emit-program "out/$lang.dl"
            # souffle's "No rules/facts defined" notices are expected for the never-staged
            # lib-body relations; anything else on stderr is shown.
            souffle -I src -g "out/$lang.cpp" "out/$lang.dl" 2> "out/$lang.gen.log" || { cat "out/$lang.gen.log"; exit 1; }
            awk '/No rules\/facts defined/{skip=2;next} skip>0{skip--;next} {print}' "out/$lang.gen.log"
            ls -la "out/$lang.cpp"
          done
          cp -r /usr/include/souffle out/souffle

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.langs != '[]'
        with:
          name: generated
          path: out
          retention-days: 7
          if-no-files-found: error

  build:
    needs: generate
    if: needs.generate.outputs.langs != '[]'
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.generate.outputs.langs) }}
        target:
          - { os: ubuntu-24.04,     platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          # macOS runs on a SELF-HOSTED Apple Silicon runner (register one under Settings →
          # Actions → Runners; it needs the Xcode command-line tools). Hosted macOS minutes
          # bill at 10x and the Python build alone took 18 of them. arm64 only: an Intel
          # target can be added as a second row when a user needs it.
          - { os: [self-hosted, macOS, ARM64], platform: darwin-arm64 }
          - { os: windows-2025,     platform: windows-x86_64 }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: gen

      - name: Compile (Linux)
        if: startsWith(matrix.target.platform, 'linux')
        run: |
          set -e
          # -static-libstdc++/-static-libgcc: the only non-glibc dependency is folded in, so
          # the binary runs on any distro with a glibc at least as old as this runner's.
          c++ -std=c++17 -O3 -w -static-libstdc++ -static-libgcc -I gen \
              "gen/${{ matrix.lang }}.cpp" -o "axiom-engine-${{ matrix.lang }}-${{ matrix.target.platform }}"
          ls -la axiom-engine-*; ldd axiom-engine-* || true

      - name: Compile (macOS, arm64)
        if: startsWith(matrix.target.platform, 'darwin')
        run: |
          set -e
          c++ -std=c++17 -O3 -w -arch arm64 -mmacosx-version-min=12.0 -I gen \
              "gen/${{ matrix.lang }}.cpp" -o "axiom-engine-${{ matrix.lang }}-${{ matrix.target.platform }}"
          ls -la axiom-engine-*; file axiom-engine-*; otool -L axiom-engine-*

      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.target.platform, 'windows')
        with:
          arch: x64

      - name: Compile (Windows, MSVC)
        if: startsWith(matrix.target.platform, 'windows')
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /bigobj /w /permissive- /Zc:__cplusplus /D_CRT_SECURE_NO_WARNINGS /DNOMINMAX /DUSE_CUSTOM_GETOPTLONG /I gen gen\${{ matrix.lang }}.cpp /Fe:axiom-engine-${{ matrix.lang }}-${{ matrix.target.platform }}.exe
          if errorlevel 1 exit /b 1
          dir axiom-engine-*

      - name: Smoke — the binary starts and reports its relations
        shell: bash
        run: |
          set -e
          bin="$(ls axiom-engine-* | grep -v '\.sha256$' | head -1)"
          chmod +x "$bin" 2>/dev/null || true
          mkdir -p facts out
          # every declared input must exist; an empty file is a valid (empty) relation
          sed -n 's/^\.input \([A-Za-z0-9_]*\)(.*/\1/p' "gen/${{ matrix.lang }}.dl" | while read -r r; do : > "facts/$r.facts"; done
          "./$bin" -F facts -D out
          echo "outputs written: $(ls out | wc -l)"

      - name: Checksum
        shell: bash
        run: |
          bin="$(ls axiom-engine-* | head -1)"
          if command -v sha256sum >/dev/null; then sha256sum "$bin" > "$bin.sha256"; else shasum -a 256 "$bin" > "$bin.sha256"; fi
          cat "$bin.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.lang }}-${{ matrix.target.platform }}
          path: axiom-engine-*
          if-no-files-found: error

  # One job for every language built: `always()` lets it run when some build failed, and a
  # language is published only if ALL FOUR of its binaries exist — a language with a missing
  # platform is left as it was (the next merge retries it, since its ENGINE_ID still differs)
  # while the others go in. One commit on main carries everything that was rebuilt.
  publish:
    needs: [generate, build]
    if: always() && needs.generate.result == 'success' && needs.generate.outputs.langs != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: gen
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: bins
          merge-multiple: true

      - name: Place the binaries under engine/binaries/<lang>/<platform>/
        id: place
        run: |
          set -e
          echo "artifacts:"; ls -la bins
          published=""
          for lang in $LANGUAGES; do
            [ -f "gen/$lang.id" ] || continue
            id="$(cat "gen/$lang.id")"
            n="$(ls bins/axiom-engine-$lang-* 2>/dev/null | grep -vc '\.sha256$' || true)"
            if [ "$n" != 4 ]; then
              echo "::warning::$lang: only $n of 4 platform binaries were built — engine/binaries/$lang left unchanged; the next merge to main retries"
              continue
            fi
            rm -rf "engine/binaries/$lang"
            for f in bins/axiom-engine-$lang-*; do
              case "$f" in *.sha256) continue;; esac
              name="$(basename "$f")"
              platform="${name#axiom-engine-$lang-}"; platform="${platform%.exe}"
              mkdir -p "engine/binaries/$lang/$platform"
              cp "$f" "engine/binaries/$lang/$platform/$name"
              chmod +x "engine/binaries/$lang/$platform/$name"
            done
            cat bins/axiom-engine-$lang-*.sha256 | sed 's#  .*/#  #' > "engine/binaries/$lang/sha256sum.txt"
            printf '%s\n' "$id" > "engine/binaries/$lang/ENGINE_ID"
            printf 'Built by the engine-binaries workflow from %s.\nRule-set id: %s (src/pipeline/run-souffle.sh --language %s --print-engine-id).\nrun-souffle.sh uses these only while the rules hash to that id.\n' "${{ github.sha }}" "$id" "$lang" > "engine/binaries/$lang/BUILD.txt"
            published="$published $lang"
          done
          echo "published=${published# }" >> "$GITHUB_OUTPUT"
          git status --short engine/binaries | head -20

      - name: Commit to main
        if: steps.place.outputs.published != ''
        run: |
          set -e
          git config user.name "engine-binaries"
          git config user.email "engine-binaries@users.noreply.github.com"
          git add -A engine/binaries
          git commit -m "engine: rebuilt binaries for ${{ steps.place.outputs.published }} from ${{ github.sha }}" \
                     -m "Built on linux-x86_64, linux-arm64, darwin-arm64 and windows-x86_64 by the engine-binaries workflow. Each language's ENGINE_ID is the id of the rules it was compiled from; run-souffle.sh uses the binary only while the checkout's rules hash to that id."
          # main may have moved during the build; rebase our one commit on top and retry.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt) — rebasing on the current main"
            git fetch origin main && git rebase origin/main
          done
          echo "::error::could not push the binaries to main after 5 attempts"; exit 1

      - name: Secondary copy — a release per language
        if: steps.place.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for lang in ${{ steps.place.outputs.published }}; do
            id="$(cat "gen/$lang.id")"; tag="engine-$lang-$id"
            mkdir -p "rel/$lang"
            cp engine/binaries/$lang/*/axiom-engine-* engine/binaries/$lang/sha256sum.txt "rel/$lang/"
            cp "gen/$lang.cpp" "rel/$lang/$lang.cpp"
            gh release delete "$tag" -y 2>/dev/null || true
            gh release create "$tag" --title "engine · $lang · ${id:0:12}" --target main \
              --notes "Prebuilt engine for the **$lang** rule set at id \`$id\` (Soufflé $(cat gen/souffle.version), pinned in src/pipeline/engine.conf), built from ${{ github.sha }}. The same binaries are committed under engine/binaries/$lang/; \`$lang.cpp\` is the generated program for anyone who prefers to compile it (Soufflé headers + a C++17 compiler)." \
              rel/$lang/*
          done
