# ─────────────────────────────────────────────────────────────────────────────
# The prebuilt-engine contract. Sourced by run-souffle.sh and by the CI workflow.
#
# SOUFFLE_VERSION is PINNED here, not read from a `souffle --version`, because the machine
# that runs a prebuilt binary has no souffle to ask — and the engine id it computes must be
# the id CI computed. Bumping it changes every language's id, which is what a new code
# generator should do. CI installs exactly this version.
#
# ENGINE_REPO is where the binaries are published: one GitHub release per (language, id),
# tagged engine-<lang>-<id>, holding axiom-engine-<lang>-<platform>[.exe] and sha256sum.txt.
# Override with AXIOM_ENGINE_REPO to fetch from a fork or a mirror.
# ─────────────────────────────────────────────────────────────────────────────
SOUFFLE_VERSION="2.5"
ENGINE_REPO="${AXIOM_ENGINE_REPO:-AxiomCodeAI/axiom-code-graph}"
