# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders)
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures
# LIB_BODY   full relation names staged empty up front, then filled scoped by the stage↔solve
#            loop; these are GB-scale bodies, never staged wholesale
IR_MARKER="all-types.csv"
LIB_SIG="type type_lines type_reference type_parameter method method_parameter method_type_parameter field field_position import enum_constant service_descriptor service_provider"
LIB_BODY="lib_expression lib_local_variable lib_block"
