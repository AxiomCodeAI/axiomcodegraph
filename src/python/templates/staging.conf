# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders).
#            PYTHON USES all-python-modules.csv, *not* -types: a package of plain functions
#            has no class at all, so a types-based marker would skip whole library shards.
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures.
#            THE PREFIX MUST BE py_: the executor strips only 'lib_', so lib_py_method -> py_method.
#            Listing bare 'method' silently stages nothing and shows up as zero boundary_lib edges.
# LIB_BODY   full relation names staged EMPTY up front so their .input directives exist; the
#            stage<->solve loop fills them scoped to the frontier. GB-scale, never staged wholesale.
IR_MARKER="all-python-modules.csv"
LIB_SIG="py_module py_type py_type_base py_type_reference py_method py_method_parameter py_field py_field_position py_import py_decorator py_decorator_argument"
LIB_BODY="lib_py_expression lib_py_call_site lib_py_block lib_py_binding lib_py_scope lib_py_comment lib_py_parse_gap lib_py_type_parameter"
