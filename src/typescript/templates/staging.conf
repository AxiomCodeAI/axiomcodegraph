# Per-language staging config, sourced by run-souffle.sh. Keeps the executor language-agnostic.
#
# IR_MARKER  file identifying a directory as an IR module (vs a root holding module folders).
#            TYPESCRIPT USES all-typescript-modules.csv, not -types: a .d.ts of plain function
#            declarations (node's `fs`, most of lib.es5) declares NO type at all, so a
#            types-based marker would silently skip exactly the shards that matter most.
# LIB_SIG    relation SUFFIXES (after the lib_ prefix) staged in full, always — signatures.
#            THE PREFIX MUST BE ts_: the executor strips only 'lib_', so lib_ts_method -> ts_method.
#            Listing bare 'method' silently stages nothing and shows up as zero boundary_lib edges.
#
#            ts_export and ts_import are SIGNATURES here, unlike Java, and that is the whole
#            client->lib mechanism: a JavaScript package's public surface is its export list, and
#            a re-export chain (index.d.ts -> ./lib/foo) is the ONLY path from a client import to
#            the real declaration. Dropping them would leave every client->lib edge stopping at
#            the barrel file. ts_variable is a signature too: `export declare const x: Foo` is a
#            declaration, and 161 measured call targets are arrow functions bound to a const.
# LIB_BODY   full relation names staged EMPTY up front so their .input directives exist; the
#            stage<->solve loop fills them scoped to the frontier. GB-scale, never staged wholesale.
#            Library IR is declarations, not bodies, so these are inert in a .d.ts-only library —
#            they exist for a library staged from SOURCE (a workspace package, a monorepo sibling).
IR_MARKER="all-typescript-modules.csv"
LIB_SIG="ts_module ts_type ts_type_heritage ts_type_parameter ts_type_reference ts_method ts_method_parameter ts_field ts_field_position ts_enum_member ts_import ts_export ts_variable ts_decorator ts_decorator_argument"
LIB_BODY="lib_ts_expression lib_ts_call_site lib_ts_block lib_ts_comment lib_ts_parse_gap"
