[versions]
spring-boot = "3.2.2"
jackson = "2.15.3"
strict-guava = { strictly = "[32.0, 33.0[", prefer = "32.1.3-jre" }

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
commons-lang3 = "org.apache.commons:commons-lang3:3.14.0"
bom-managed = { module = "org.springframework:spring-core" }
dangling-ref = { module = "com.example:dangling", version.ref = "does-not-exist" }

[bundles]
persistence = ["jackson-databind", "commons-lang3"]

[plugins]
boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-jvm = "org.jetbrains.kotlin.jvm:1.9.22"
